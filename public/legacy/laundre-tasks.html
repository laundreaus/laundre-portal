<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laundré · Tasks</title>
<script>if(localStorage.getItem('laundre_auth')!=='1'){location.replace('laundre-portal.html');}</script>
<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--ink:#2E3D36;--muted:#8a9790;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}
  header .brand{font-family:Georgia,serif;font-size:20px;color:var(--green-d);} header .spacer{flex:1;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);}
  .btn-danger{background:transparent;color:#B4472F;border:1px solid #e6cfc7;}
  main{max-width:1300px;margin:0 auto;padding:22px 22px 60px;}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .toolbar h2{font-size:20px;margin:0;color:var(--green-d);} .toolbar .spacer{flex:1;}
  .hint{color:var(--muted);font-size:12.5px;margin-bottom:16px;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
  @media(max-width:1000px){.board{grid-template-columns:1fr 1fr;}}
  @media(max-width:640px){.board{grid-template-columns:1fr;}}
  .col{background:#efe9dd;border:1px solid var(--cream-line);border-radius:14px;padding:12px;min-height:140px;transition:.12s;}
  .col.drop{background:#e3eee5;border-color:#bcd8c4;box-shadow:inset 0 0 0 2px #bcd8c4;}
  .col h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px;}
  .col h3 .n{background:#fff;border-radius:20px;padding:1px 9px;font-size:11px;color:var(--muted);}
  .col.todo h3{color:#7c6a4f;} .col.in_progress h3{color:#356089;} .col.to_review h3{color:#9a6a22;} .col.completed h3{color:#2f6b46;}
  .card{background:#fff;border:1px solid var(--cream-line);border-radius:11px;padding:12px 13px;margin-bottom:10px;box-shadow:0 1px 4px rgba(52,73,61,.06);cursor:pointer;transition:.1s;}
  .card:hover{border-color:var(--green-l,#7fa08f);box-shadow:0 3px 12px rgba(52,73,61,.12);}
  .card.dragging{opacity:.45;}
  .card .tt{font-weight:700;color:var(--green-d);font-size:14px;margin-bottom:4px;}
  .card .ds{color:#6b7d73;font-size:12.5px;line-height:1.45;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .who{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#5f7469;background:#EDF1EC;border-radius:20px;padding:2px 9px;}
  .due{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:#EEE7DA;color:#7c6a4f;} .due.over{background:#FBE9E2;color:#9a3a22;} .due.soon{background:#FBEED6;color:#9a6a22;}
  .clip{font-size:11.5px;color:#5f7469;background:#EDF1EC;border-radius:20px;padding:2px 9px;}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 6px;}
  #overlay,#doverlay{position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
  #overlay.show,#doverlay.show{display:flex;}
  .editor{background:var(--cream);border-radius:14px;width:540px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .ehead{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--cream-line);}
  .ehead h3{margin:0;font-size:16px;color:var(--green-d);} .ehead .spacer{flex:1;} .close{background:transparent;border:none;font-size:22px;color:#8a9790;cursor:pointer;}
  .ebody{padding:18px 20px;}
  label{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:12px 0 5px;} .ebody label:first-child{margin-top:0;}
  input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:8px;padding:9px 11px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .efoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 20px;}
  .msg{font-size:12px;color:#B4472F;padding:0 20px;min-height:15px;}
  .attach{display:flex;align-items:center;gap:8px;background:#FBF9F4;border:1px solid var(--cream-line);border-radius:8px;padding:8px 11px;font-size:13px;margin-top:6px;}
  .attach a{color:var(--accent);font-weight:700;text-decoration:none;flex:1;}
  .attach button{background:transparent;border:none;color:#B4472F;cursor:pointer;font-size:13px;}
  /* detail */
  .drow{font-size:13.5px;line-height:1.6;margin-bottom:8px;} .drow b{color:var(--green-d);}
  .ddesc{white-space:pre-wrap;font-size:13.5px;line-height:1.55;color:#3c4a42;background:#FBF9F4;border:1px solid var(--cream-line);border-radius:8px;padding:12px 14px;margin:6px 0 12px;}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
  .pill.todo{background:#EEE7DA;color:#7c6a4f;} .pill.in_progress{background:#DDE9F1;color:#356089;} .pill.to_review{background:#FBEED6;color:#9a6a22;} .pill.completed{background:#E1EDE4;color:#2f6b46;}
</style>
</head>
<body>
<header><span class="brand">Laundré</span><span style="font-weight:700;font-size:14px">· Tasks</span><span class="spacer"></span><a class="chip" href="laundre-portal.html">⌂ Portal</a></header>
<main>
  <div class="toolbar"><h2>Task List</h2><span class="spacer"></span><button class="btn btn-green" id="addBtn">＋ New task</button></div>
  <div class="hint">Drag a card between columns to change its status · click a card to see full details.</div>
  <div class="board" id="board"></div>
</main>

<!-- Edit / create -->
<div id="overlay"><div class="editor">
  <div class="ehead"><h3 id="etitle">New task</h3><span class="spacer"></span><button class="close" id="eclose">×</button></div>
  <div class="ebody">
    <label>Title</label><input id="f_title" placeholder="What needs doing?">
    <label>Description</label><textarea id="f_desc" rows="4" placeholder="Details (optional)"></textarea>
    <div class="two">
      <div><label>Assign to</label><select id="f_assignee"></select></div>
      <div><label>Due date</label><input id="f_due" type="date"></div>
    </div>
    <label>Status</label><select id="f_status"><option value="todo">To Do</option><option value="in_progress">In Progress</option><option value="to_review">To Review</option><option value="completed">Completed</option></select>
    <label>Attachment</label><input id="f_file" type="file">
    <div id="f_attachCur"></div>
  </div>
  <div class="msg" id="emsg"></div>
  <div class="efoot"><button class="btn btn-danger" id="edelete" style="margin-right:auto;display:none">Delete</button><button class="btn btn-ghost" id="ecancel">Cancel</button><button class="btn btn-green" id="esave">Save task</button></div>
</div></div>

<!-- Detail -->
<div id="doverlay"><div class="editor">
  <div class="ehead"><h3 id="dtitle">Task</h3><span class="spacer"></span><button class="close" id="dclose">×</button></div>
  <div class="ebody" id="dbody"></div>
  <div class="efoot" id="dfoot"></div>
</div></div>

<script>
var CSRF=(window.LAUNDRE_CSRF||'');
function SESSION(){try{return JSON.parse(localStorage.getItem('laundre_session')||'null')||{};}catch(e){return {};}}
var ME=SESSION(); var ADMIN=(ME.role==='admin');
var COLS=[{k:'todo',label:'To Do'},{k:'in_progress',label:'In Progress'},{k:'to_review',label:'To Review'},{k:'completed',label:'Completed'}];
var LABEL={todo:'To Do',in_progress:'In Progress',to_review:'To Review',completed:'Completed'};
var TASKS=[], USERS=[];
function hdrs(json){var h={'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'};if(json)h['Content-Type']='application/json';return h;}
async function apiGet(u){var r=await fetch(u,{headers:hdrs(false),credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function apiSend(u,m,b){return fetch(u,{method:m,headers:hdrs(true),credentials:'same-origin',body:b?JSON.stringify(b):null});}
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uploadFile(f){return new Promise(function(res,rej){var rd=new FileReader();rd.onerror=function(){rej(new Error('read failed'));};rd.onload=function(){apiSend('/upload-api','POST',{data:rd.result,name:f.name}).then(function(r){return r.ok?r.json():Promise.reject(new Error('upload HTTP '+r.status));}).then(res).catch(rej);};rd.readAsDataURL(f);});}
function fmtDue(d){if(!d)return null;var dt=new Date((''+d).slice(0,10)+'T00:00');return dt.toLocaleDateString('en-AU',{day:'numeric',month:'short'});}
function fmtDate(d){if(!d)return '—';return new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});}
function dueClass(d){if(!d)return '';var days=Math.ceil((new Date((''+d).slice(0,10)+'T00:00')-new Date())/864e5);if(days<0)return 'over';if(days<=2)return 'soon';return '';}
function roleShort(r){return ({admin:'Admin',user:'Staff',franchisee:'Franchisee',cleaner:'Cleaner',maintenance:'Maintenance'})[r]||r||'';}
function getTask(id){return TASKS.find(function(x){return String(x.id)===String(id);});}

function render(){
  var board=document.getElementById('board');
  board.innerHTML=COLS.map(function(c){
    var items=TASKS.filter(function(t){return t.status===c.k;});
    var cards=items.length?items.map(cardHTML).join(''):'<div class="empty">Drop tasks here</div>';
    return '<div class="col '+c.k+'" data-col="'+c.k+'"><h3>'+c.label+' <span class="n">'+items.length+'</span></h3><div class="drop-body">'+cards+'</div></div>';
  }).join('');
  wireDnD();
  board.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click',function(e){ if(card.dataset.dragged==='1'){card.dataset.dragged='';return;} openDetail(card.dataset.id); });
  });
}
function cardHTML(t){
  var due=t.due_date?('<span class="due '+dueClass(t.due_date)+'">📅 '+fmtDue(t.due_date)+'</span>'):'';
  var who=t.assignee?('<span class="who">👤 '+esc(t.assignee.name)+'</span>'):'<span class="who">Unassigned</span>';
  var clip=t.file_name?'<span class="clip">📎 file</span>':'';
  return '<div class="card" draggable="true" data-id="'+t.id+'">'
    +'<div class="tt">'+esc(t.title)+'</div>'
    +(t.description?'<div class="ds">'+esc(t.description)+'</div>':'')
    +'<div class="meta">'+who+due+clip+'</div>'
    +'</div>';
}
function wireDnD(){
  var dragId=null;
  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('dragstart',function(e){dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',function(){card.classList.remove('dragging');card.dataset.dragged='1';setTimeout(function(){card.dataset.dragged='';},50);});
  });
  document.querySelectorAll('.col').forEach(function(col){
    col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('drop');e.dataTransfer.dropEffect='move';});
    col.addEventListener('dragleave',function(){col.classList.remove('drop');});
    col.addEventListener('drop',function(e){e.preventDefault();col.classList.remove('drop');var id=e.dataTransfer.getData('text/plain')||dragId;var status=col.dataset.col;var t=getTask(id);if(t&&t.status!==status){changeStatus(id,status);}});
  });
}
async function changeStatus(id,status){
  var t=getTask(id); var old=t?t.status:null;
  if(t){t.status=status;render();}
  var r=await apiSend('/tasks-api/'+id+'/status','PATCH',{status:status});
  if(!r.ok){ if(t)t.status=old; render(); alert('Could not update status.'); }
}

/* ---------- Detail ---------- */
function openDetail(id){
  var t=getTask(id); if(!t)return;
  var body=document.getElementById('dbody');
  document.getElementById('dtitle').textContent=t.title;
  var attach=t.file_name?('<div class="attach">📎 <a href="'+esc(t.file_path)+'" download="'+esc(t.file_name)+'" target="_blank" rel="noopener">'+esc(t.file_name)+'</a></div>'):'';
  var statusSel='';
  if(ADMIN || (t.assignee && String(t.assignee.id)===String(ME.userId||ME.id))){
    statusSel='<select id="d_status" style="max-width:200px">'+COLS.map(function(c){return '<option value="'+c.k+'"'+(c.k===t.status?' selected':'')+'>'+c.label+'</option>';}).join('')+'</select>';
  } else {
    statusSel='<span class="pill '+t.status+'">'+esc(LABEL[t.status])+'</span>';
  }
  body.innerHTML=''
    +(t.description?'<div class="ddesc">'+esc(t.description)+'</div>':'<div class="drow" style="color:#8a9790">No description.</div>')
    +'<div class="drow"><b>Assigned to:</b> '+(t.assignee?esc(t.assignee.name)+' · '+roleShort(t.assignee.role):'Unassigned')+'</div>'
    +'<div class="drow"><b>Due:</b> '+(t.due_date?fmtDate(t.due_date):'—')+'</div>'
    +'<div class="drow"><b>Status:</b> '+statusSel+'</div>'
    +(t.creator?'<div class="drow"><b>Created by:</b> '+esc(t.creator.name)+' · '+fmtDate(t.created_at)+'</div>':'')
    +(attach?'<div class="drow"><b>Attachment:</b></div>'+attach:'');
  var foot=document.getElementById('dfoot');
  foot.innerHTML=(ADMIN?'<button class="btn btn-ghost" id="d_edit">Edit</button>':'')+'<button class="btn btn-green" id="d_close2">Close</button>';
  document.getElementById('doverlay').classList.add('show');
  var ds=document.getElementById('d_status'); if(ds){ds.onchange=function(){changeStatus(id,ds.value);};}
  document.getElementById('d_close2').onclick=closeDetail;
  var de=document.getElementById('d_edit'); if(de){de.onclick=function(){closeDetail();openEditor(id);};}
}
function closeDetail(){document.getElementById('doverlay').classList.remove('show');}
document.getElementById('dclose').onclick=closeDetail;

/* ---------- Edit / create (admin) ---------- */
var editId=null, pendingAttach=undefined; // undefined = keep, null = remove, {} = new
function fillAssignees(sel){
  var opts='<option value="">— Unassigned —</option>';
  USERS.filter(function(u){return ['admin','user','franchisee','cleaner','maintenance'].indexOf(u.role)>=0;})
    .forEach(function(u){opts+='<option value="'+u.id+'"'+(String(u.id)===String(sel)?' selected':'')+'>'+esc(u.name)+' ('+roleShort(u.role)+')</option>';});
  document.getElementById('f_assignee').innerHTML=opts;
}
function renderAttachCur(t){
  var host=document.getElementById('f_attachCur');
  if(t&&t.file_name&&pendingAttach===undefined){
    host.innerHTML='<div class="attach">📎 <a href="'+esc(t.file_path)+'" target="_blank" rel="noopener">'+esc(t.file_name)+'</a><button type="button" id="rmAttach">Remove</button></div>';
    document.getElementById('rmAttach').onclick=function(){pendingAttach=null;host.innerHTML='<div class="attach" style="color:#9a3a22">Attachment will be removed on save.</div>';};
  } else { host.innerHTML=''; }
}
function openEditor(id){
  editId=id||null; pendingAttach=undefined; var t=id?getTask(id):null;
  document.getElementById('etitle').textContent=id?'Edit task':'New task';
  document.getElementById('f_title').value=t?t.title:'';
  document.getElementById('f_desc').value=t?(t.description||''):'';
  fillAssignees(t&&t.assignee?t.assignee.id:'');
  document.getElementById('f_due').value=t&&t.due_date?(''+t.due_date).slice(0,10):'';
  document.getElementById('f_status').value=t?t.status:'todo';
  document.getElementById('f_file').value='';
  document.getElementById('emsg').textContent='';
  document.getElementById('edelete').style.display=id?'inline-block':'none';
  renderAttachCur(t);
  document.getElementById('overlay').classList.add('show');
}
function closeEditor(){document.getElementById('overlay').classList.remove('show');editId=null;}
document.getElementById('addBtn').onclick=function(){openEditor(null);};
document.getElementById('eclose').onclick=closeEditor;
document.getElementById('ecancel').onclick=closeEditor;
document.getElementById('esave').onclick=async function(){
  var title=document.getElementById('f_title').value.trim();
  var msg=document.getElementById('emsg');
  if(!title){msg.textContent='Please enter a title.';return;}
  var t=editId?getTask(editId):null;
  var file_path = t?(t.file_path||null):null, file_name = t?(t.file_name||null):null;
  if(pendingAttach===null){ file_path=null; file_name=null; }
  var f=document.getElementById('f_file').files[0];
  var btn=this; btn.disabled=true; msg.style.color='#6b7d73'; msg.textContent='Saving…';
  try{
    if(f){ if(f.size>12*1024*1024){throw new Error('File too large (max 12MB).');} var up=await uploadFile(f); file_path=up.url; file_name=up.name; }
    var payload={title:title,description:document.getElementById('f_desc').value.trim(),
      status:document.getElementById('f_status').value,
      due_date:document.getElementById('f_due').value||null,
      file_path:file_path,file_name:file_name,
      assignee_id:document.getElementById('f_assignee').value?Number(document.getElementById('f_assignee').value):null};
    var r=await apiSend(editId?('/tasks-api/'+editId):'/tasks-api', editId?'PUT':'POST', payload);
    if(r.status===422){var j=await r.json();msg.style.color='#B4472F';msg.textContent=(j.errors?Object.values(j.errors)[0][0]:(j.message||'Check the form'));btn.disabled=false;return;}
    if(!r.ok){msg.style.color='#B4472F';msg.textContent='Could not save (HTTP '+r.status+').';btn.disabled=false;return;}
    closeEditor(); load();
  }catch(e){msg.style.color='#B4472F';msg.textContent=e.message;btn.disabled=false;}
};
document.getElementById('edelete').onclick=async function(){
  if(!editId)return; if(!confirm('Delete this task?'))return;
  var r=await apiSend('/tasks-api/'+editId,'DELETE',null);
  if(r.ok||r.status===204){closeEditor();load();}else{alert('Could not delete.');}
};

async function load(){
  try{
    var reqs=[apiGet('/tasks-api')];
    if(ADMIN) reqs.push(apiGet('/users-api'));
    var res=await Promise.all(reqs);
    TASKS=res[0]||[];
    if(ADMIN) USERS=res[1]||[];
    render();
  }catch(e){ document.getElementById('board').innerHTML='<div class="empty">Could not load tasks — please refresh.</div>'; }
}
if(!ADMIN){ document.getElementById('addBtn').style.display='none'; }
load();
</script>
</body>
</html>
