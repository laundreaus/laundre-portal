<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laundré · Maintenance</title>
<script>if(localStorage.getItem('laundre_auth')!=='1'){location.replace('laundre-portal.html');}</script>
<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--muted:#8a9790;--ink:#2E3D36;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  .logo svg{height:24px;width:auto;display:block;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:7px;padding:10px 16px;font-size:13.5px;font-weight:700;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);} .btn-ghost:hover{background:#EFEADD;}
  .btn-danger{background:transparent;color:#B4472F;border:1px solid #e6cfc7;} .btn-danger:hover{background:#f7ece8;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  a.chip:hover{background:#EFEADD;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:7px;padding:10px 12px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}
  header .ttl{font-weight:700;font-size:15px;} header .spacer{flex:1;}
  main{max-width:1100px;margin:0 auto;padding:22px 22px 70px;}
  h2{font-size:20px;margin:0 0 4px;color:var(--green-d);} .sub{color:#6b7d73;font-size:13px;margin-bottom:18px;}
  .card{background:#fff;border:1px solid var(--cream-line);border-radius:14px;padding:20px 22px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);display:flex;align-items:center;}
  .card h3 .spacer{flex:1;}
  .guide{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0ece2;} .guide:last-child{border-bottom:none;}
  .guide .gi{width:34px;height:34px;border-radius:8px;background:#EBE4D5;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .guide .gt{flex:1;} .guide .gt b{color:var(--green-d);font-size:14px;} .guide .gt span{display:block;color:#8a9790;font-size:12px;}
  .gopen{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:7px 11px;} .gopen:hover{background:#EFEADD;}
  .vis{display:inline-block;border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:700;margin-left:6px;}
  .vis.all{background:#E1EDE4;color:#2f6b46;} .vis.one{background:#EBE4D5;color:#6b5a43;}
  .rowbtns{display:flex;gap:6px;} .rowbtns button{padding:6px 10px;font-size:12px;border-radius:6px;}
  .citem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--cream-line);border-radius:10px;margin-bottom:9px;cursor:pointer;user-select:none;}
  .citem input{width:22px;height:22px;accent-color:var(--green);} .citem.done{background:#EDF4EE;border-color:#bcd8c4;} .citem span{font-size:14.5px;font-weight:600;}
  label.fld{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:14px 0 5px;}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .thumb{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--cream-line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{position:absolute;top:2px;right:2px;background:rgba(30,42,36,.7);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;}
  .addphoto{width:84px;height:84px;border:2px dashed var(--cream-line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#a49b86;font-size:26px;cursor:pointer;}
  .submitted{background:#E1EDE4;color:#2f6b46;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:14px;}
  .msg{font-size:13px;color:#B4472F;min-height:16px;margin-top:8px;}
  .rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13.5px;} .rrow:last-child{border-bottom:none;}
  .rrow .d{font-weight:700;color:var(--green-d);width:130px;}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;} .pill.ok{background:#E1EDE4;color:#2f6b46;} .pill.iss{background:#F5E3DB;color:#B4472F;}
  .matrix{overflow-x:auto;background:#fff;border:1px solid var(--cream-line);border-radius:14px;}
  table{border-collapse:collapse;width:100%;} th,td{padding:9px 8px;font-size:12.5px;text-align:center;border-bottom:1px solid #f0ece2;white-space:nowrap;}
  th{background:var(--green-d);color:#EAF0EC;font-size:10.5px;text-transform:uppercase;} th.l,td.l{text-align:left;} td.l{font-weight:700;color:var(--green-d);}
  .mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-weight:800;font-size:14px;}
  .mk.yes{background:#E1EDE4;color:#2f6b46;cursor:pointer;} .mk.yes.iss{background:#F5E3DB;color:#B4472F;} .mk.no{background:#F1ECE1;color:#c9c1b0;}
  .empty{padding:36px;text-align:center;color:#8a9790;}
  .alert{background:#FBE9E2;border:1px solid #e6cabb;color:#9a3a22;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:600;margin-bottom:16px;line-height:1.5;}
  .warn{display:inline-block;background:#F5E3DB;color:#B4472F;border-radius:12px;padding:1px 8px;font-size:10.5px;font-weight:800;margin-left:6px;}
  #overlay{position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
  #overlay.show{display:flex;}
  .modal{background:var(--cream);border-radius:14px;width:620px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .mhead{display:flex;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--cream-line);}
  .mhead h3{margin:0;font-size:16px;color:var(--green-d);} .mhead .spacer{flex:1;}
  .mbody{padding:18px 20px;} .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;} .mgrid .full{grid-column:1/-1;}
  .kv{font-size:13.5px;line-height:1.6;margin-bottom:6px;} .kv b{color:var(--green-d);}
  .chk{font-size:13.5px;padding:3px 0;} .chk .y{color:#2f6b46;font-weight:700;} .chk .n{color:#B4472F;font-weight:700;}
  .close{background:transparent;border:none;font-size:22px;color:#8a9790;}
  .mfoot{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 18px;}
  .vidbox{position:relative;border-radius:12px;overflow:hidden;background:#22302a;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .vplay{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;}
  .vplay:after{content:'';border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #33473D;margin-left:5px;}
  .vcap{position:absolute;bottom:12px;left:14px;color:#eaf0ec;font-size:12.5px;background:rgba(30,42,36,.55);padding:4px 10px;border-radius:20px;}
  .vph{font-size:11px;color:#B4472F;background:#F5E3DB;border-radius:20px;padding:2px 9px;font-weight:700;margin-left:8px;}
  .vidbox iframe{width:100%;height:100%;border:0;position:absolute;inset:0;}
</style>
</head>

<main id="main"></main>

<div id="overlay"><div class="modal">
  <div class="mhead"><h3 id="mTitle"></h3><span class="spacer"></span><button class="close" id="mClose">×</button></div>
  <div class="mbody" id="mBody"></div>
  <div class="mfoot" id="mFoot"></div>
</div></div>

<script>
/* ---- Intro video (placeholder — set INTRO_VIDEO to a YouTube/Vimeo embed URL) ---- */
var INTRO_VIDEO='';
function videoCard(cap){return '<div class="card"><h3>Intro video <span class="vph">Placeholder</span></h3><div class="vidbox" onclick="playIntro(this)"><div class="vplay"></div><div class="vcap">'+cap+'</div></div></div>';}
function playIntro(el){var u=INTRO_VIDEO;if(u){el.innerHTML='<iframe src="'+u+(u.indexOf('?')>=0?'&':'?')+'autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>';}else{el.innerHTML='<div class="vcap" style="position:static;background:none;color:#eaf0ec;text-align:center;padding:22px">\u25B6 Intro video would play here.<br><span style="opacity:.7">(Placeholder \u2014 add the video embed in the tool.)</span></div>';}}

const ITEMS=['Machines inspected','Filters / lint cleaned','Water & drainage checked','Payment system checked','Faults resolved / logged','Other (see notes)'];
function SESSION(){try{return JSON.parse(localStorage.getItem('laundre_session')||'null')||{role:'admin'};}catch(e){return {role:'admin'};}}
const ME=SESSION(); const ADMIN=!(ME.role&&ME.role!=='admin');
const CSRF=(window.LAUNDRE_CSRF||'');
function hdrs(json){var h={'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'};if(json)h['Content-Type']='application/json';return h;}
async function apiGet(u){const r=await fetch(u,{headers:hdrs(false),credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function apiSend(u,method,body){const r=await fetch(u,{method:method,headers:hdrs(true),credentials:'same-origin',body:body?JSON.stringify(body):null});if(!r.ok)throw new Error('HTTP '+r.status);return r.status===204?null:r.json();}
function ms(t){if(!t)return 0;var n=Date.parse(t);return isNaN(n)?0:n;}
function uploadFile(f){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej(new Error('read failed'));rd.onload=async()=>{try{const j=await apiSend('/upload-api','POST',{data:rd.result,name:f.name});res(j);}catch(e){rej(e);}};rd.readAsDataURL(f);});}
let LOGS=[], GUIDES=[], LOCS=[];
function normLog(r){return {id:r.id,locationId:r.location_id,date:(''+(r.date||'')).slice(0,10),by:r.by,items:r.items||{},notes:r.notes,issues:r.issues,photos:r.photos||[],geo:r.geo||null,submittedAt:ms(r.updated_at||r.created_at)};}
function normGuide(g){return {id:g.id,title:g.title,category:g.category,visibility:(g.visibility===''||g.visibility==null)?'all':(''+g.visibility),link:g.link,url:g.file_path,fileName:g.file_name,note:g.note,createdAt:ms(g.created_at)};}
async function reloadLogs(){LOGS=(await apiGet('/maintenance-api')).map(normLog);}
async function reloadGuides(){GUIDES=(await apiGet('/guides-api')).map(normGuide);}
function esc(s){return (''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function laundromats(){return LOCS;}
function locName(id){const l=LOCS.find(x=>x.id==id);return l?l.name:(id||'—');}
function findSub(locId,date){return LOGS.find(x=>x.locationId===locId && x.date===date);}
function dayLabel(ds){const d=new Date(ds+'T00:00');return d.toLocaleDateString('en-AU',{weekday:'short'})+' '+d.getDate();}
function guideVisible(g){ if(ADMIN) return true; return g.visibility==='all'||(''+g.visibility)===(''+ME.locationId); }

/* ============ MAINTENANCE (staff) VIEW ============ */
let pendingPhotos=[];
function renderStaff(){
  const loc=ME.locationId; const existing=findSub(loc,todayStr());
  pendingPhotos=existing?(existing.photos||[]).slice():[];
  const done=existing?existing.items:{};
  const main=document.getElementById('main');
  let h='<h2>Maintenance</h2><div class="sub">'+esc(locName(loc))+' · '+new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div>';
  h+=videoCard('Watch the maintenance intro video');
  // guides
  const gs=GUIDES.filter(guideVisible);
  h+='<div class="card"><h3>Guides &amp; Instructions</h3>';
  if(gs.length){ gs.forEach(g=>{ const open=g.link?'<a class="gopen" href="'+esc(g.link)+'" target="_blank" rel="noopener">Open ↗</a>':(g.url?'<a class="gopen" href="'+g.url+'" download="'+esc(g.fileName||'guide')+'">Download</a>':'');
    h+='<div class="guide"><div class="gi">📘</div><div class="gt"><b>'+esc(g.title)+'</b><span>'+esc(g.category||'')+(g.note?' · '+esc(g.note):'')+'</span></div>'+open+'</div>'; });
  } else h+='<div class="sub" style="margin:0">No guides have been shared yet.</div>';
  h+='</div>';
  // log form
  h+='<div class="card">';
  if(existing) h+='<div class="submitted">✓ Logged today at '+new Date(existing.submittedAt).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+' — you can update and resubmit.</div>';
  h+='<h3>Log maintenance check</h3>';
  ITEMS.forEach((it,i)=>{const on=!!done[i];h+='<label class="citem'+(on?' done':'')+'" data-ci="'+i+'"><input type="checkbox" '+(on?'checked':'')+'><span>'+esc(it)+'</span></label>';});
  h+='<label class="fld">Notes</label><textarea id="c_notes" rows="2" placeholder="Work done, parts used, observations…">'+esc(existing?existing.notes:'')+'</textarea>';
  h+='<label class="fld">Issues / faults for the team</label><textarea id="c_issues" rows="2" placeholder="Anything needing follow-up or parts…">'+esc(existing?existing.issues:'')+'</textarea>';
  h+='<label class="fld">Photos</label><div class="photos" id="photos"></div><input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none">';
  h+='<div class="msg" id="msg"></div><div style="text-align:right;margin-top:12px"><button class="btn btn-green" id="submitBtn">'+(existing?'Update log':'Submit log')+'</button></div></div>';
  // recent
  const recent=LOGS.filter(x=>x.locationId===loc).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
  h+='<div class="card"><h3>Recent logs</h3>';
  if(recent.length){recent.forEach(r=>{const cnt=Object.values(r.items||{}).filter(Boolean).length;
    h+='<div class="rrow"><span class="d">'+new Date(r.date+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})+'</span><span class="pill ok">'+cnt+'/'+ITEMS.length+'</span>'+(r.issues?' <span class="pill iss">issue</span>':'')+(r.photos&&r.photos.length?' <span class="pill ok">'+r.photos.length+' 📷</span>':'')+'</div>';});
  } else h+='<div class="sub" style="margin:0">No logs yet.</div>';
  h+='</div>';
  main.innerHTML=h;
  renderPhotos();
  main.querySelectorAll('.citem').forEach(el=>el.querySelector('input').addEventListener('change',e=>el.classList.toggle('done',e.target.checked)));
  document.getElementById('photoInput').onchange=e=>{[...e.target.files].forEach(f=>{if(f.size>2.5*1024*1024){document.getElementById('msg').textContent='Some photos over 2.5MB were skipped.';return;}const rd=new FileReader();rd.onload=()=>{pendingPhotos.push(rd.result);renderPhotos();};rd.readAsDataURL(f);});e.target.value='';};
  document.getElementById('submitBtn').onclick=submitLog;
}
function renderPhotos(){const c=document.getElementById('photos');if(!c)return;c.innerHTML=pendingPhotos.map((p,i)=>'<div class="thumb"><img src="'+p+'"><button data-rp="'+i+'">×</button></div>').join('')+'<div class="addphoto" id="addphoto">+</div>';c.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{pendingPhotos.splice(+b.dataset.rp,1);renderPhotos();});document.getElementById('addphoto').onclick=()=>document.getElementById('photoInput').click();}
function submitLog(){
  const items={};document.querySelectorAll('.citem').forEach(el=>{items[+el.dataset.ci]=el.querySelector('input').checked;});
  const body={date:todayStr(),items,notes:document.getElementById('c_notes').value.trim(),issues:document.getElementById('c_issues').value.trim(),photos:pendingPhotos.slice()};
  const msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');btn.disabled=true;msg.style.color='#6b7d73';msg.textContent='Capturing location…';
  function finish(){msg.textContent='Saving…';apiSend('/maintenance-api','POST',body).then(reloadLogs).then(renderStaff).catch(e=>{btn.disabled=false;msg.style.color='#B4472F';msg.textContent='Could not submit: '+e.message;});}
  if(navigator.geolocation){var done=false;var to=setTimeout(function(){if(done)return;done=true;body.geo={error:'timeout',at:Date.now()};finish();},9000);navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(to);body.geo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),at:Date.now()};finish();},function(err){if(done)return;done=true;clearTimeout(to);body.geo={error:(err&&err.message)||'denied',at:Date.now()};finish();},{enableHighAccuracy:true,timeout:8000,maximumAge:0});}else{body.geo={error:'unsupported',at:Date.now()};finish();}
}

/* ============ ADMIN VIEW: guides mgmt + submissions ============ */
function lastSubDate(locId){const ds=LOGS.filter(x=>x.locationId===locId).map(x=>x.date).sort();return ds.length?ds[ds.length-1]:null;}
function daysSince(ds){if(!ds)return Infinity;return Math.round((new Date(todayStr()+'T00:00')-new Date(ds+'T00:00'))/864e5);}
function renderAdmin(){
  const main=document.getElementById('main');
  const locs=laundromats(); const today=todayStr();
  const doneToday=locs.filter(l=>findSub(l.id,today)).length;
  const gaps={}; locs.forEach(l=>gaps[l.id]=daysSince(lastSubDate(l.id)));
  const overdue=locs.filter(l=>gaps[l.id]>=2);
  let h='<h2>Maintenance</h2><div class="sub">Machine &amp; technology guides, plus maintenance logs across all laundromats · '+doneToday+' of '+locs.length+' logged today</div>';
  if(overdue.length){ h+='<div class="alert">⚠ '+overdue.length+' store'+(overdue.length>1?'s':'')+' overdue — no maintenance log for 2+ days: '
    +overdue.map(l=>esc(l.name)+' ('+(gaps[l.id]===Infinity?'never':gaps[l.id]+' days')+')').join(' · ')+'</div>'; }
  // guides mgmt
  h+='<div class="card"><h3>Guides &amp; Instructions <span class="spacer"></span><button class="btn btn-green" id="addGuide" style="padding:7px 13px;font-size:12.5px">＋ Add guide</button></h3><div id="guideList"></div></div>';
  // submissions matrix
  const days=[];for(let i=0;i<10;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}
  h+='<div class="card" style="padding:0;overflow:hidden"><h3 style="padding:18px 20px 0">Maintenance Logs</h3>';
  if(locs.length){
    h+='<div class="matrix" style="border:none"><table><thead><tr><th class="l">Laundromat</th>'+days.map(d=>'<th>'+dayLabel(d)+'</th>').join('')+'</tr></thead><tbody>';
    locs.forEach(l=>{const badge=gaps[l.id]>=2?' <span class="warn">⚠ '+(gaps[l.id]===Infinity?'never':gaps[l.id]+'d')+'</span>':'';h+='<tr><td class="l">'+esc(l.name)+badge+'</td>'+days.map(d=>{const s=findSub(l.id,d);if(s){return '<td><span class="mk yes'+(s.issues?' iss':'')+'" data-loc="'+l.id+'" data-date="'+d+'">✓</span></td>';}return '<td><span class="mk no">✗</span></td>';}).join('')+'</tr>';});
    h+='</tbody></table></div><div class="sub" style="padding:12px 20px 18px;margin:0">✓ logged · ✗ none · orange = issue. Click a ✓ for detail.</div>';
  } else h+='<div class="empty">No laundromats yet.</div>';
  h+='</div>';
  main.innerHTML=h;
  renderGuideList();
  document.getElementById('addGuide').onclick=()=>openGuideEditor(null);
  main.querySelectorAll('.mk.yes').forEach(b=>b.onclick=()=>openLogDetail(b.dataset.loc,b.dataset.date));
}
function renderGuideList(){
  const el=document.getElementById('guideList');
  if(!GUIDES.length){el.innerHTML='<div class="sub" style="margin:0">No guides yet. Add machine manuals, tech instructions or SOPs.</div>';return;}
  el.innerHTML=GUIDES.map(g=>{
    const open=g.link?'<a class="gopen" href="'+esc(g.link)+'" target="_blank" rel="noopener">Open ↗</a>':(g.url?'<a class="gopen" href="'+g.url+'" download="'+esc(g.fileName||'guide')+'">Download</a>':'');
    const vis=g.visibility==='all'?'<span class="vis all">All</span>':'<span class="vis one">'+esc(locName(g.visibility))+'</span>';
    return '<div class="guide"><div class="gi">📘</div><div class="gt"><b>'+esc(g.title)+vis+'</b><span>'+esc(g.category||'')+(g.note?' · '+esc(g.note):'')+'</span></div>'+open
      +'<div class="rowbtns"><button class="btn btn-ghost" data-ge="'+g.id+'">Edit</button><button class="btn btn-danger" data-gd="'+g.id+'">Del</button></div></div>';
  }).join('');
  el.querySelectorAll('[data-ge]').forEach(b=>b.onclick=()=>openGuideEditor(b.dataset.ge));
  el.querySelectorAll('[data-gd]').forEach(b=>b.onclick=async()=>{const g=GUIDES.find(x=>x.id==b.dataset.gd);if(confirm('Delete “'+g.title+'”?')){try{await apiSend('/guides-api/'+b.dataset.gd,'DELETE');await reloadGuides();renderGuideList();}catch(e){alert('Could not delete: '+e.message);}}});
}
function openGuideEditor(id){
  const g=id?GUIDES.find(x=>x.id==id):null;
  document.getElementById('mTitle').textContent=id?'Edit guide':'Add guide';
  const locs=laundromats();
  document.getElementById('mBody').innerHTML=
    '<div class="mgrid"><div class="full"><label class="fld" style="margin-top:0">Title</label><input id="g_title" value="'+esc(g?g.title:'')+'"></div>'
    +'<div><label class="fld" style="margin-top:0">Category</label><input id="g_category" value="'+esc(g?g.category:'')+'" placeholder="e.g. Washer / Dryer / POS"></div>'
    +'<div><label class="fld" style="margin-top:0">Visible to</label><select id="g_visibility"><option value="all">All laundromats</option>'+locs.map(l=>'<option value="'+l.id+'"'+(g&&(''+g.visibility)===(''+l.id)?' selected':'')+'>'+esc(l.name)+'</option>').join('')+'</select></div>'
    +'<div class="full"><label class="fld" style="margin-top:0">Link (video/manual) — optional</label><input id="g_link" value="'+esc(g?g.link:'')+'" placeholder="https://"></div>'
    +'<div class="full"><label class="fld" style="margin-top:0">Or upload a file (≤3MB)</label><input id="g_file" type="file"></div>'
    +'<div class="full"><label class="fld" style="margin-top:0">Note</label><input id="g_note" value="'+esc(g?g.note:'')+'"></div></div>'
    +'<div class="msg" id="gmsg"></div>';
  if(g&&g.visibility&&g.visibility!=='all') document.getElementById('g_visibility').value=g.visibility;
  document.getElementById('mFoot').innerHTML='<button class="btn btn-ghost" id="gCancel">Cancel</button><button class="btn btn-green" id="gSave">Save guide</button>';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('gCancel').onclick=closeModal;
  document.getElementById('gSave').onclick=async()=>{
    const title=document.getElementById('g_title').value.trim();const link=document.getElementById('g_link').value.trim();
    const gmsg=document.getElementById('gmsg');
    if(!title){gmsg.style.color='#B4472F';gmsg.textContent='Please enter a title.';return;}
    const fileInput=document.getElementById('g_file');const f=fileInput.files[0];
    if(f && f.size>8*1024*1024){gmsg.style.color='#B4472F';gmsg.textContent='File too large (max 8MB). Use a link.';return;}
    if(!link && !f && !(g&&(g.url||g.link))){gmsg.style.color='#B4472F';gmsg.textContent='Add a link or upload a file.';return;}
    const sb=document.getElementById('gSave');sb.disabled=true;gmsg.style.color='#6b7d73';gmsg.textContent='Saving…';
    try{
      let file_path=g?(g.url||''):'',file_name=g?(g.fileName||''):'';
      if(f){const up=await uploadFile(f);file_path=up.url;file_name=up.name;}
      const payload={title,category:document.getElementById('g_category').value.trim(),visibility:document.getElementById('g_visibility').value,link:link,file_path:link?'':file_path,file_name:link?'':file_name,note:document.getElementById('g_note').value.trim()};
      if(id) await apiSend('/guides-api/'+id,'PUT',payload); else await apiSend('/guides-api','POST',payload);
      await reloadGuides();renderGuideList();closeModal();
    }catch(e){gmsg.style.color='#B4472F';gmsg.textContent='Could not save: '+e.message;}
    finally{sb.disabled=false;}
  };
}
function openLogDetail(locId,date){
  const s=findSub(locId,date);if(!s)return;
  document.getElementById('mTitle').textContent=locName(locId)+' — '+new Date(date+'T00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
  let h='<div class="kv"><b>Logged by:</b> '+esc(s.by)+' at '+new Date(s.submittedAt).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+'</div><div style="margin:10px 0">';
  ITEMS.forEach((it,i)=>{const on=!!(s.items&&s.items[i]);h+='<div class="chk">'+(on?'<span class="y">✓</span>':'<span class="n">✗</span>')+' '+esc(it)+'</div>';});
  h+='</div>';
  if(s.notes)h+='<div class="kv"><b>Notes:</b> '+esc(s.notes)+'</div>';
  if(s.issues)h+='<div class="kv"><b>Issues:</b> '+esc(s.issues)+'</div>';
  if(s.geo){h+='<div class="kv"><b>Location:</b> '+(s.geo.lat?('<a href="https://maps.google.com/?q='+s.geo.lat+','+s.geo.lng+'" target="_blank" rel="noopener">'+s.geo.lat+', '+s.geo.lng+'</a> (±'+(s.geo.acc||0)+'m)'):('not captured'+(s.geo.error?' — '+esc(s.geo.error):'')))+(s.geo.at?(' at '+new Date(s.geo.at).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})):'')+'</div>';}
  if(s.photos&&s.photos.length)h+='<div class="kv"><b>Photos:</b></div><div class="photos">'+s.photos.map(p=>'<a class="thumb" href="'+p+'" target="_blank"><img src="'+p+'"></a>').join('')+'</div>';
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('mFoot').innerHTML='';
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('mClose').onclick=closeModal;

async function boot(){
  try{
    const [locs,logs,guides]=await Promise.all([apiGet('/locations-api'),apiGet('/maintenance-api'),apiGet('/guides-api')]);
    LOCS=(locs||[]).map(s=>({id:s.id,name:s.name}));
    LOGS=(logs||[]).map(normLog); GUIDES=(guides||[]).map(normGuide);
  }catch(e){document.getElementById('main').innerHTML='<div class="empty">Could not load maintenance data — please refresh. ('+esc(e.message)+')</div>';return;}
  if(ADMIN) renderAdmin(); else renderStaff();
}
boot();
</script>
</body>
