<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laundré · Investors</title>
<script>if(localStorage.getItem('laundre_auth')!=='1'){location.replace('laundre-portal.html');}</script>
<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--ink:#2E3D36;--muted:#8a9790;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;}
  header .brand{font-family:Georgia,serif;font-size:20px;color:var(--green-d);} header .spacer{flex:1;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  main{max-width:1100px;margin:0 auto;padding:22px 22px 70px;}
  h2{font-size:20px;margin:0 0 4px;color:var(--green-d);} .sub{color:#6b7d73;font-size:13px;margin-bottom:18px;}
  .stats{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--cream-line);border-radius:12px;padding:14px 20px;min-width:150px;}
  .stat .n{font-size:24px;font-weight:800;color:var(--green-d);} .stat .l{font-size:12px;color:var(--muted);}
  .matrix{overflow-x:auto;background:#fff;border:1px solid var(--cream-line);border-radius:14px;}
  table{border-collapse:collapse;width:100%;} th,td{padding:11px 12px;font-size:13px;text-align:left;border-bottom:1px solid #f0ece2;}
  th{background:var(--green-d);color:#EAF0EC;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  td .nm{font-weight:700;color:var(--green-d);} td .em{color:var(--muted);font-size:12px;}
  .amt{font-weight:800;color:var(--green-d);} .pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;background:#E1EDE4;color:#2f6b46;}
  .pill.pend{background:#EEE7DA;color:#7c6a4f;}
  .empty{padding:36px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<header><span class="brand">Laundré</span><span style="font-weight:700;font-size:14px">· Investors</span><span class="spacer"></span><a class="chip" href="laundre-portal.html">⌂ Portal</a></header>
<main>
  <h2>Investors</h2>
  <div class="sub">Investor prospects and their formally registered interest.</div>
  <div class="stats" id="stats"></div>
  <div id="wrap"></div>
</main>
<script>
var CSRF=(window.LAUNDRE_CSRF||'');
function hdrs(){return {'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'};}
async function apiGet(u){var r=await fetch(u,{headers:hdrs(),credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});}
function money(n){return '$'+(+n).toLocaleString();}
function amount(o){ if(!o.interest_submitted_at) return '<span class="pill pend">Not yet submitted</span>'; if(o.interest_min&&o.interest_max) return '<span class="amt">'+money(o.interest_min)+' – '+money(o.interest_max)+'</span>'; if(o.interest_min) return '<span class="amt">'+money(o.interest_min)+'+</span>'; return '<span class="amt">To discuss</span>'; }

async function load(){
  var list;
  try{ list=await apiGet('/investors-api'); }
  catch(e){ document.getElementById('wrap').innerHTML='<div class="empty">Could not load — please refresh.</div>'; return; }
  var submitted=list.filter(function(o){return o.interest_submitted_at;});
  var total=submitted.reduce(function(a,o){return a+(+(o.interest_min||o.interest_max||0));},0);
  document.getElementById('stats').innerHTML=
     '<div class="stat"><div class="n">'+list.length+'</div><div class="l">Investor prospects</div></div>'
    +'<div class="stat"><div class="n">'+submitted.length+'</div><div class="l">Interest submitted</div></div>'
    +'<div class="stat"><div class="n">'+money(total)+'</div><div class="l">Indicated (min) total</div></div>';
  var wrap=document.getElementById('wrap');
  if(!list.length){wrap.innerHTML='<div class="empty">No investors yet. Create one in User Management with the Investor role.</div>';return;}
  var h='<div class="matrix"><table><thead><tr><th>Investor</th><th>Contact</th><th>Interest</th><th>Note</th><th>Submitted</th></tr></thead><tbody>';
  list.forEach(function(o){var u=o.user||{};
    h+='<tr><td><div class="nm">'+esc(u.name||'—')+'</div></td>'
      +'<td><div class="em">'+esc(u.email||'')+(u.phone?'<br>'+esc(u.phone):'')+'</div></td>'
      +'<td>'+amount(o)+'</td>'
      +'<td style="max-width:280px;white-space:normal;color:#5f7469">'+esc(o.interest_note||'')+'</td>'
      +'<td>'+fmt(o.interest_submitted_at)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  wrap.innerHTML=h;
}
load();
</script>
</body>
</html>
