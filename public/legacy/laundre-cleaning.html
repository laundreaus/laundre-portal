<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--muted:#8a9790;--ink:#2E3D36;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  .logo svg{height:24px;width:auto;display:block;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:7px;padding:10px 18px;font-size:14px;font-weight:700;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);} .btn-ghost:hover{background:#EFEADD;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  a.chip:hover{background:#EFEADD;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:7px;padding:10px 12px;width:100%;}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}
  header .ttl{font-weight:700;font-size:15px;} header .spacer{flex:1;}
  main{max-width:1100px;margin:0 auto;padding:22px 22px 70px;}
  h2{font-size:20px;margin:0 0 4px;color:var(--green-d);} .sub{color:#6b7d73;font-size:13px;margin-bottom:18px;}
  .card{background:#fff;border:1px solid var(--cream-line);border-radius:14px;padding:20px 22px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
  /* checklist */
  .citem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--cream-line);border-radius:10px;margin-bottom:9px;cursor:pointer;user-select:none;background:#fff;}
  .citem input{width:22px;height:22px;accent-color:var(--green);}
  .citem.done{background:#EDF4EE;border-color:#bcd8c4;}
  .citem span{font-size:14.5px;font-weight:600;}
  label.fld{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:14px 0 5px;}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .thumb{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--cream-line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{position:absolute;top:2px;right:2px;background:rgba(30,42,36,.7);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer;}
  .addphoto{width:84px;height:84px;border:2px dashed var(--cream-line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#a49b86;font-size:26px;cursor:pointer;background:#fff;}
  .submitted{background:#E1EDE4;color:#2f6b46;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;margin-bottom:14px;}
  .msg{font-size:13px;color:#B4472F;min-height:16px;margin-top:8px;}
  /* recent list */
  .rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ece2;font-size:13.5px;}
  .rrow:last-child{border-bottom:none;} .rrow .d{font-weight:700;color:var(--green-d);width:130px;}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
  .pill.ok{background:#E1EDE4;color:#2f6b46;} .pill.iss{background:#F5E3DB;color:#B4472F;}
  /* admin matrix */
  .matrix{overflow-x:auto;background:#fff;border:1px solid var(--cream-line);border-radius:14px;}
  table{border-collapse:collapse;width:100%;}
  th,td{padding:9px 8px;font-size:12.5px;text-align:center;border-bottom:1px solid #f0ece2;white-space:nowrap;}
  th{background:var(--green-d);color:#EAF0EC;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  th.l,td.l{text-align:left;} td.l{font-weight:700;color:var(--green-d);}
  .mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-weight:800;font-size:14px;}
  .mk.yes{background:#E1EDE4;color:#2f6b46;cursor:pointer;} .mk.yes.iss{background:#F5E3DB;color:#B4472F;}
  .mk.no{background:#F1ECE1;color:#c9c1b0;}
  .empty{padding:36px;text-align:center;color:#8a9790;background:#fff;border-radius:12px;}
  .alert{background:#FBE9E2;border:1px solid #e6cabb;color:#9a3a22;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:600;margin-bottom:16px;line-height:1.5;}
  .warn{display:inline-block;background:#F5E3DB;color:#B4472F;border-radius:12px;padding:1px 8px;font-size:10.5px;font-weight:800;margin-left:6px;}
  .itemrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0ece2;} .itemrow:last-child{border-bottom:none;}
  .itemrow span{flex:1;font-size:14px;} .itemrow button{background:transparent;border:none;color:#B4472F;font-size:17px;cursor:pointer;line-height:1;}
  .additem{display:flex;gap:8px;margin-top:12px;} .additem input{flex:1;}
  /* modal */
  #overlay{position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
  #overlay.show{display:flex;}
  .modal{background:var(--cream);border-radius:14px;width:620px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .mhead{display:flex;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--cream-line);}
  .mhead h3{margin:0;font-size:16px;color:var(--green-d);} .mhead .spacer{flex:1;}
  .mbody{padding:18px 20px;} .kv{font-size:13.5px;line-height:1.6;margin-bottom:6px;} .kv b{color:var(--green-d);}
  .chk{font-size:13.5px;padding:3px 0;} .chk .y{color:#2f6b46;font-weight:700;} .chk .n{color:#B4472F;font-weight:700;}
  .close{background:transparent;border:none;font-size:22px;color:#8a9790;}
  .vidbox{position:relative;border-radius:12px;overflow:hidden;background:#22302a;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .vplay{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;}
  .vplay:after{content:'';border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #33473D;margin-left:5px;}
  .vcap{position:absolute;bottom:12px;left:14px;color:#eaf0ec;font-size:12.5px;background:rgba(30,42,36,.55);padding:4px 10px;border-radius:20px;}
  .vph{font-size:11px;color:#B4472F;background:#F5E3DB;border-radius:20px;padding:2px 9px;font-weight:700;margin-left:8px;}
  .vidbox iframe{width:100%;height:100%;border:0;position:absolute;inset:0;}
  .replist .reprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 6px;border-bottom:1px solid #f0ece2;cursor:pointer;}
  .replist .reprow:last-child{border-bottom:none;}
  .replist .reprow:hover{background:#F8F5EE;border-radius:8px;}
  .replist .rl b{display:block;color:var(--green-d);font-size:14px;} .replist .rl span{color:#8a9790;font-size:12px;}
  .replist .rr{display:flex;align-items:center;gap:8px;white-space:nowrap;} .replist .open{color:var(--accent);font-weight:700;font-size:13px;}
  .replist .rpill{border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;} .replist .rpill.iss{background:#F5E3DB;color:#B4472F;} .replist .rpill.ph{background:#EDF1EC;color:#2f6b46;}
</style>

<main id="main"></main>

<div id="overlay"><div class="modal">

  <div class="mbody" id="mBody"></div>

<script>
/* ---- Intro video (placeholder — set INTRO_VIDEO to a YouTube/Vimeo embed URL) ---- */
var INTRO_VIDEO='';
function ytEmbed(u){if(!u)return '';u=(''+u).trim();if(/youtube\.com\/embed\//.test(u)||/player\.vimeo\.com/.test(u))return u;var m=u.match(/[?&]v=([A-Za-z0-9_\-]{6,})/)||u.match(/youtu\.be\/([A-Za-z0-9_\-]{6,})/)||u.match(/youtube\.com\/shorts\/([A-Za-z0-9_\-]{6,})/);if(m)return 'https://www.youtube.com/embed/'+m[1];if(/^[A-Za-z0-9_\-]{6,15}$/.test(u))return 'https://www.youtube.com/embed/'+u;return u;}
(function(){try{fetch('/settings-api/intro_video_cleaner',{headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(v){if(typeof v==='string'&&v)INTRO_VIDEO=v;}).catch(function(){});}catch(e){}})();
function videoCard(cap){return '<div class="card"><h3>Intro video</h3><div class="vidbox" onclick="playIntro(this)"><div class="vplay"></div><div class="vcap">'+cap+'</div></div></div>';}
function playIntro(el){var u=ytEmbed(INTRO_VIDEO);if(u){el.innerHTML='<iframe src="'+u+(u.indexOf('?')>=0?'&':'?')+'autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>';}else{el.innerHTML='<div class="vcap" style="position:static;background:none;color:#eaf0ec;text-align:center;padding:22px">\u25B6 Intro video would play here.<br><span style="opacity:.7">(Placeholder \u2014 add the video embed in the tool.)</span></div>';}}

const CSRF=(window.LAUNDRE_CSRF||'');
function hdrs(json){var h={'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'};if(json)h['Content-Type']='application/json';return h;}
async function apiGet(u){const r=await fetch(u,{headers:hdrs(false),credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function apiSend(u,method,body){const r=await fetch(u,{method:method,headers:hdrs(true),credentials:'same-origin',body:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status);return r.status===204?null:r.json();}
function uploadFile(f){var fd=new FormData();fd.append('file',f,f.name);return fetch('/upload-api',{method:'POST',headers:hdrs(false),credentials:'same-origin',body:fd}).then(function(r){if(!r.ok)throw new Error('upload HTTP '+r.status);return r.json();});}
const DEFAULT_ITEMS=['Bins emptied','Lint traps emptied','Floors mopped','Surfaces wiped','Machines & benches wiped'];
let ITEMS=DEFAULT_ITEMS.slice();
async function saveItemsRemote(){try{await apiSend('/cleaning-items-api','POST',{items:ITEMS,loc:(window.__FIXED_LOC||null)});}catch(e){alert('Could not save checklist items: '+e.message);}}
function SESSION(){try{return JSON.parse(localStorage.getItem('laundre_session')||'null')||{role:'admin'};}catch(e){return {role:'admin'};}}
const ME=SESSION(); const ADMIN=!(ME.role&&ME.role!=='admin');
function ms(t){if(!t)return 0;var n=Date.parse(t);return isNaN(n)?0:n;}
let DATA=[]; let LOCS=[];
function normalize(r){return {id:r.id,locationId:r.location_id,date:(''+(r.date||'')).slice(0,10),by:r.by,items:r.items||{},labels:r.labels||[],notes:r.notes,issues:r.issues,photos:r.photos||[],geo:r.geo||null,submittedAt:ms(r.updated_at||r.created_at)};}
async function reloadData(){DATA=(await apiGet('/cleaning-api')).map(normalize);}
function esc(s){return (''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function laundromats(){return LOCS;}
function locName(id){const l=LOCS.find(x=>x.id===id);return l?l.name:(id||'—');}
function findSub(locId,date){return DATA.find(x=>x.locationId===locId && x.date===date);}
function dayLabel(ds){const d=new Date(ds+'T00:00');return d.toLocaleDateString('en-AU',{weekday:'short'})+' '+d.getDate();}

/* ============ CLEANER VIEW ============ */
let pendingPhotos=[];
function renderCleaner(){
  const loc=ME.locationId; const existing=findSub(loc,todayStr());
  pendingPhotos = existing ? (existing.photos||[]).slice() : [];
  const done = existing ? existing.items : {};
  const main=document.getElementById('main');
  let h='<h2>Daily Cleaning</h2><div class="sub">'+esc(locName(loc))+' · '+new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div>';
  h+=videoCard('Watch the daily cleaning intro video');
  h+='<div class="card">';
  if(existing) h+='<div class="submitted">✓ Submitted today at '+new Date(existing.submittedAt).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+' — you can update and resubmit.</div>';
  h+='<h3>Checklist</h3>';
  ITEMS.forEach((it,i)=>{ const on=!!done[i]; h+='<label class="citem'+(on?' done':'')+'" data-ci="'+i+'"><input type="checkbox" '+(on?'checked':'')+'><span>'+esc(it)+'</span></label>'; });
  h+='<label class="fld">Notes</label><textarea id="c_notes" rows="2" placeholder="Anything worth noting…">'+esc(existing?existing.notes:'')+'</textarea>';
  h+='<label class="fld">Issues (anything that needs attention)</label><textarea id="c_issues" rows="2" placeholder="Report any issues for the team…">'+esc(existing?existing.issues:'')+'</textarea>';
  h+='<label class="fld">Photos</label><div class="photos" id="photos"></div>';
  h+='<input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none">';
  h+='<div class="msg" id="msg"></div>';
  h+='<div style="text-align:right;margin-top:12px"><button class="btn btn-green" id="submitBtn">'+(existing?'Update submission':'Submit daily clean')+'</button></div>';
  h+='</div>';
  // recent
  const recent=DATA.filter(x=>x.locationId===loc).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
  h+='<div class="card"><h3>Recent submissions</h3>';
  if(recent.length){ recent.forEach(r=>{ const cnt=Object.values(r.items||{}).filter(Boolean).length;
    h+='<div class="rrow"><span class="d">'+new Date(r.date+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})+'</span>'
      +'<span class="pill ok">'+cnt+'/'+ITEMS.length+' done</span>'+(r.issues?' <span class="pill iss">issue</span>':'')
      +(r.photos&&r.photos.length?' <span class="pill ok">'+r.photos.length+' 📷</span>':'')+'</div>'; });
  } else h+='<div class="sub" style="margin:0">No submissions yet.</div>';
  h+='</div>';
  main.innerHTML=h;
  renderPhotos();
  main.querySelectorAll('.citem').forEach(el=>el.querySelector('input').addEventListener('change',e=>{el.classList.toggle('done',e.target.checked);}));
  document.getElementById('photoInput').onchange=async e=>{
    const files=[...e.target.files]; e.target.value='';
    const msg=document.getElementById('msg');
    for(let i=0;i<files.length;i++){ const f=files[i];
      if(f.size>12*1024*1024){ msg.style.color='#B4472F'; msg.textContent='Some photos over 12MB were skipped.'; continue; }
      msg.style.color='#6b7d73'; msg.textContent='Uploading photo…';
      try{ const up=await uploadFile(f); pendingPhotos.push(up.url); renderPhotos(); }
      catch(err){ msg.style.color='#B4472F'; msg.textContent='A photo failed to upload — please try again.'; }
    }
    if(msg.textContent==='Uploading photo…') msg.textContent='';
  };
  document.getElementById('submitBtn').onclick=submitClean;
}
function renderPhotos(){
  const c=document.getElementById('photos'); if(!c) return;
  c.innerHTML=pendingPhotos.map((p,i)=>'<div class="thumb"><img src="'+p+'"><button data-rp="'+i+'">×</button></div>').join('')
    +'<div class="addphoto" id="addphoto">+</div>';
  c.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{pendingPhotos.splice(+b.dataset.rp,1);renderPhotos();});
  document.getElementById('addphoto').onclick=()=>document.getElementById('photoInput').click();
}
function submitClean(){
  const items={};
  document.querySelectorAll('.citem').forEach(el=>{items[+el.dataset.ci]=el.querySelector('input').checked;});
  const body={date:todayStr(),items,labels:ITEMS.slice(),
    notes:document.getElementById('c_notes').value.trim(),issues:document.getElementById('c_issues').value.trim(),
    photos:pendingPhotos.slice(),geo:null};
  const msg=document.getElementById('msg'), btn=document.getElementById('submitBtn');
  btn.disabled=true; msg.style.color='#6b7d73'; msg.textContent='Saving…';
  function finish(){apiSend('/cleaning-api','POST',body).then(reloadData).then(renderCleaner).catch(e=>{btn.disabled=false;msg.style.color='#B4472F';msg.textContent='Could not submit: '+e.message;});}
  if(navigator.geolocation){var done=false;var to=setTimeout(function(){if(done)return;done=true;body.geo={error:'timeout',at:Date.now()};finish();},9000);navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(to);body.geo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),at:Date.now()};finish();},function(err){if(done)return;done=true;clearTimeout(to);body.geo={error:(err&&err.message)||'denied',at:Date.now()};finish();},{enableHighAccuracy:true,timeout:8000,maximumAge:0});}else{body.geo={error:'unsupported',at:Date.now()};finish();}
}

/* ============ ADMIN DASHBOARD ============ */
function lastSubDate(locId){const ds=DATA.filter(x=>x.locationId===locId).map(x=>x.date).sort();return ds.length?ds[ds.length-1]:null;}
function daysSince(ds){if(!ds)return Infinity;return Math.round((new Date(todayStr()+'T00:00')-new Date(ds+'T00:00'))/864e5);}
function renderAdmin(){
  const main=document.getElementById('main');
  const locs=laundromats();
  const days=[]; for(let i=0;i<10;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}
  const today=todayStr();
  const doneToday=locs.filter(l=>findSub(l.id,today)).length;
  const gaps={}; locs.forEach(l=>gaps[l.id]=daysSince(lastSubDate(l.id)));
  const overdue=locs.filter(l=>gaps[l.id]>=2);
  let h='<h2>Cleaning</h2><div class="sub">Daily cleaning submissions across all laundromats · '+doneToday+' of '+locs.length+' done today</div>';
  if(overdue.length){ h+='<div class="alert">⚠ '+overdue.length+' store'+(overdue.length>1?'s':'')+' overdue — no clean submitted for 2+ days: '
    +overdue.map(l=>esc(l.name)+' ('+(gaps[l.id]===Infinity?'never':gaps[l.id]+' days')+')').join(' · ')+'</div>'; }
  h+='<div class="card"><h3>Cleaning checklist items</h3><div id="itemsList"></div>'
    +'<div class="additem"><input id="newItem" placeholder="Add a checklist item…"><button class="btn btn-green" id="addItemBtn">Add</button></div>'
    +'<div class="sub" style="margin:10px 0 0">These appear on the cleaner’s daily checklist. Past submissions keep the items they were completed against.</div></div>';
  if(!locs.length){main.innerHTML=h+'<div class="empty">No laundromats yet. Add them in Site Locations.</div>';wireItems();return;}
  h+='<div class="matrix"><table><thead><tr><th class="l">Laundromat</th>'+days.map(d=>'<th>'+dayLabel(d)+'</th>').join('')+'</tr></thead><tbody>';
  locs.forEach(l=>{
    const badge=gaps[l.id]>=2?' <span class="warn">⚠ '+(gaps[l.id]===Infinity?'never':gaps[l.id]+'d')+'</span>':'';
    h+='<tr><td class="l">'+esc(l.name)+badge+'</td>'+days.map(d=>{
      const s=findSub(l.id,d);
      if(s){const iss=s.issues?' iss':'';return '<td><span class="mk yes'+iss+'" data-loc="'+l.id+'" data-date="'+d+'">✓</span></td>';}
      return '<td><span class="mk no">✗</span></td>';
    }).join('')+'</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="sub" style="margin-top:12px">✓ submitted · ✗ not submitted · orange = issue · ⚠ = overdue 2+ days. Click a ✓ for detail.</div>';
  // ---- Recent reports (clickable) ----
  {
    var subs=DATA.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((b.submittedAt||0)-(a.submittedAt||0));});
    h+='<div class="card"><h3>Recent reports</h3>';
    if(!subs.length){ h+='<div class="sub" style="margin:0">No cleaning reports have been submitted yet. When a cleaner submits, it appears here \u2014 click any row to open the full report.</div>'; }
    else{
      h+='<div class="replist">'+subs.slice(0,80).map(function(s){
        var iss=s.issues?'<span class="rpill iss">issue</span>':'';
        var ph=(s.photos&&s.photos.length)?'<span class="rpill ph">'+s.photos.length+' \ud83d\udcf7</span>':'';
        var when=new Date(s.date+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
        return '<div class="reprow" data-loc="'+s.locationId+'" data-date="'+s.date+'"><div class="rl"><b>'+esc(locName(s.locationId))+'</b><span>'+when+' \u00b7 by '+esc(s.by||'\u2014')+'</span></div><div class="rr">'+iss+ph+'<span class="open">Open \u2192</span></div></div>';
      }).join('')+'</div>';
    }
    h+='</div>';
  }
  main.innerHTML=h;
  wireItems();
  main.querySelectorAll('.mk.yes').forEach(b=>b.onclick=()=>openDetail(b.dataset.loc,b.dataset.date));
  main.querySelectorAll('.reprow').forEach(b=>b.onclick=()=>openDetail(b.dataset.loc,b.dataset.date));
}
function wireItems(){
  const el=document.getElementById('itemsList'); if(!el) return;
  el.innerHTML=ITEMS.map((it,i)=>'<div class="itemrow"><span>'+esc(it)+'</span><button data-ri="'+i+'" title="Remove">×</button></div>').join('')||'<div class="sub" style="margin:0">No items yet.</div>';
  el.querySelectorAll('[data-ri]').forEach(b=>b.onclick=async()=>{if(ITEMS.length<=1){alert('Keep at least one item.');return;}ITEMS.splice(+b.dataset.ri,1);await saveItemsRemote();renderAdmin();});
  const add=document.getElementById('addItemBtn'), inp=document.getElementById('newItem');
  const doAdd=async()=>{const v=inp.value.trim();if(!v)return;ITEMS.push(v);await saveItemsRemote();renderAdmin();};
  if(add) add.onclick=doAdd;
  if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
}
function openDetail(locId,date){
  const s=findSub(locId,date); if(!s) return;
  document.getElementById('mTitle').textContent=locName(locId)+' — '+new Date(date+'T00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
  let h='<div class="kv"><b>Submitted by:</b> '+esc(s.by)+' at '+new Date(s.submittedAt).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+'</div>';
  if(s.geo){h+='<div class="kv"><b>Location:</b> '+(s.geo.lat?('<a href="https://maps.google.com/?q='+s.geo.lat+','+s.geo.lng+'" target="_blank" rel="noopener">'+s.geo.lat+', '+s.geo.lng+'</a> (+/-'+(s.geo.acc||0)+'m)'):('not captured'+(s.geo.error?' - '+esc(s.geo.error):'')))+(s.geo.at?(' at '+new Date(s.geo.at).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})):'')+'</div>';}
  h+='<div style="margin:10px 0">';
  (s.labels&&s.labels.length?s.labels:ITEMS).forEach((it,i)=>{const on=!!(s.items&&s.items[i]);h+='<div class="chk">'+(on?'<span class="y">✓</span>':'<span class="n">✗</span>')+' '+esc(it)+'</div>';});
  h+='</div>';
  if(s.notes) h+='<div class="kv"><b>Notes:</b> '+esc(s.notes)+'</div>';
  if(s.issues) h+='<div class="kv"><b>Issues:</b> '+esc(s.issues)+'</div>';
  if(s.photos&&s.photos.length){ h+='<div class="kv"><b>Photos:</b></div><div class="photos">'+s.photos.map(p=>'<a class="thumb" href="'+p+'" target="_blank"><img src="'+p+'"></a>').join('')+'</div>'; }
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('mClose').onclick=()=>document.getElementById('overlay').classList.remove('show');

async function boot(){
  try{
    const [locs,data,items]=await Promise.all([apiGet('/locations-api'),apiGet('/cleaning-api'),apiGet('/cleaning-items-api'+(window.__FIXED_LOC?('?loc='+window.__FIXED_LOC):''))]);
    LOCS=(locs||[]).map(s=>({id:s.id,name:s.name}));
    DATA=(data||[]).map(normalize);
    if(Array.isArray(items)&&items.length)ITEMS=items;
  }catch(e){document.getElementById('main').innerHTML='<div class="empty">Could not load cleaning data — please refresh. ('+esc(e.message)+')</div>';return;}
  if(ADMIN) renderAdmin(); else renderCleaner();
}
boot();
</script>
</body>
</html>
