<html lang="en">
<head>

<title>Laundré · Sites Acquisition</title>
<script>(function(){var a=localStorage.getItem('laundre_auth')==='1',s=null;try{s=JSON.parse(localStorage.getItem('laundre_session')||'null');}catch(e){}if(!a||(s&&s.role&&s.role!=='admin'))location.replace('laundre-portal.html');})();</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--ink:#2E3D36;--muted:#8a9790;--ok:#2f6b46;--warn:#B4472F;}
  *{box-sizing:border-box;} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  button{font-family:inherit;cursor:pointer;} .btn{border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:700;} .btn-green{background:var(--green);color:#fff;} .btn-accent{background:var(--accent);color:#fff;} .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:30;} header .ttl{font-weight:800;font-size:15px;color:var(--green-d);} header .spacer{flex:1;}
  main{max-width:1180px;margin:0 auto;padding:18px 22px 80px;}
  .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px;}
  /* list view */
  .scard{background:#fff;border:1px solid var(--cream-line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.14s;}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:10.5px;font-weight:800;background:#EEF3EF;color:var(--green);}
  .pill.done{background:#E1EDE4;color:var(--ok);} .pill.pkg{background:#F5E7DD;color:var(--accent);}
  /* editor */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .top input.name{font-size:19px;font-weight:800;color:var(--green-d);border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;min-width:280px;}
  .top input.name:focus{border-color:var(--cream-line);background:#fff;}
  .stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;}
  .step{flex:0 0 auto;border:1px solid var(--cream-line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;color:#5f7469;white-space:nowrap;cursor:pointer;}
  .step.on{background:var(--green-d);color:#fff;border-color:var(--green-d);} .step.done{background:#E1EDE4;color:var(--ok);border-color:#cfe2d5;}
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:900px){ .layout{grid-template-columns:1fr;} }
  .panel{background:#fff;border:1px solid var(--cream-line);border-radius:14px;padding:18px 20px;}
  .panel h3{margin:0 0 4px;font-size:15px;color:var(--green-d);} .panel .hint{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .fld{margin-bottom:14px;} .fld label{display:block;font-size:12px;font-weight:700;color:#5f7469;margin-bottom:5px;}
  .fld input,.fld textarea,.fld select{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);background:#FBF9F4;border:1px solid var(--cream-line);border-radius:8px;padding:10px 12px;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--green);background:#fff;}
  .fld textarea{min-height:80px;resize:vertical;line-height:1.5;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;} .two .fld{margin-bottom:0;}
  .two{margin-bottom:14px;}
  /* address autocomplete */
  .addr-wrap{position:relative;}
  .addr-results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--cream-line);border-radius:8px;margin-top:4px;box-shadow:0 10px 26px rgba(0,0,0,.14);z-index:60;max-height:250px;overflow-y:auto;display:none;}
  .addr-results.show{display:block;}
  .addr-results div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #F1ECE1;line-height:1.4;}
  .addr-results div:last-child{border-bottom:none;} .addr-results div:hover{background:#F4EFE6;}
  #map{height:340px;border-radius:12px;border:1px solid var(--cream-line);}
  .maplegend{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.7;} .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px;}
  .overlap{margin-top:10px;font-size:12.5px;padding:9px 12px;border-radius:8px;} .overlap.clash{background:#F7E4DE;color:var(--warn);font-weight:700;} .overlap.clear{background:#E4EFE7;color:var(--ok);font-weight:700;}
  .navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
  .savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--cream) 40%);padding:14px 0 0;display:flex;gap:10px;align-items:center;}
  .savenote{font-size:12px;color:var(--muted);}
  .pkgbox{background:#FBF6EF;border:1px solid #EBD9C6;border-radius:10px;padding:14px 16px;margin-top:8px;}
  .linkrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;} .linkrow input{flex:1;min-width:220px;background:#fff;border:1px solid var(--cream-line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--green-d);font-family:inherit;}
  .sharebox{background:#FBF6EF;border:1px solid #EBD9C6;border-radius:12px;padding:15px 17px;margin-top:16px;} .sharebox .sharehd{font-size:14px;font-weight:800;color:var(--green-d);}
  /* native cost calculator wizard */
  .cwiz-steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .cwiz-st{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;background:#FBF9F4;border:1px solid var(--cream-line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);font-weight:700;cursor:pointer;}
  .cwiz-st .cn{width:20px;height:20px;border-radius:50%;background:#EFE7D6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto;}
  .cwiz-st.on{border-color:var(--green);color:var(--green-d);} .cwiz-st.on .cn{background:var(--green);color:#fff;}
  .cwiz-st.done .cn{background:#D9A73E;color:#33473d;}
  .cwiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
  .cpill{display:inline-block;background:#EAF0EC;color:var(--green-d);border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px;margin-bottom:12px;}
  .clines{margin-top:8px;} .cln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F1ECE1;font-size:14px;}
  .cln.big{font-weight:900;font-size:16px;color:var(--green-d);border-bottom:none;padding-top:11px;}
  .cln .mut{color:var(--muted);font-weight:400;font-size:12px;}
  /* step 3 machines */
  .c3sticky{position:sticky;top:66px;z-index:15;background:#33473D;color:#EAF0EC;border-radius:12px;padding:12px 15px;margin-bottom:12px;box-shadow:0 8px 22px rgba(51,71,61,.25);}
  .c3top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;} .c3lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#b9c8bf;font-weight:800;} .c3lab .mut{color:#93a89b;font-weight:400;text-transform:none;letter-spacing:0;}
  .c3sel{font-size:23px;font-weight:900;line-height:1.1;} .c3tgt{font-size:16px;font-weight:800;color:#cdd9d1;}
  .c3track{height:11px;border-radius:20px;background:rgba(255,255,255,.16);position:relative;overflow:hidden;margin:9px 0 5px;} .c3fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8fb89e,#C4703F 140%);width:0;transition:width .35s;} .c3fill.over{background:linear-gradient(90deg,#e0a06f,#c0392b);}
  .c3diff{font-size:12px;font-weight:700;color:#cdd9d1;} .c3items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:60px;overflow:auto;} .c3items .it{background:rgba(255,255,255,.12);border-radius:16px;padding:3px 9px;font-size:11px;white-space:nowrap;} .c3items .none{color:#93a89b;font-size:12px;}
  .c3guide{margin-bottom:10px;} .c3gh{font-weight:700;color:var(--green);font-size:12.5px;margin-bottom:5px;}
  .ctbl{width:100%;border-collapse:collapse;font-size:12px;} .ctbl th{background:var(--green-d);color:#EAF0EC;font-size:9.5px;text-transform:uppercase;padding:5px 6px;text-align:left;} .ctbl th.r,.ctbl td.r{text-align:right;} .ctbl td{padding:5px 6px;border-bottom:1px solid #F1ECE1;} .ctbl tr.hit td{background:#EAF0EC;font-weight:800;color:var(--green-d);}
  .c3tog{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:12.5px;color:#5f7469;font-weight:700;} .c3tog label{display:flex;align-items:center;gap:6px;cursor:pointer;} .c3tog input[type=checkbox]{width:auto;}
  .c3disc{margin-left:auto;display:inline-flex;align-items:center;gap:8px;} .c3disc input{width:78px;font-family:inherit;font-size:13px;text-align:right;background:#FBF9F4;border:1px solid var(--cream-line);border-radius:7px;padding:7px 9px;color:var(--ink);}
  .mtbl{width:100%;border-collapse:collapse;font-size:12.5px;} .mtbl thead th{position:sticky;top:0;background:#fff;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:#8a9790;text-align:left;padding:6px;border-bottom:1px solid var(--cream-line);} .mtbl th.r,.mtbl td.r{text-align:right;}
  .mtbl td{padding:5px 6px;vertical-align:middle;border-bottom:1px solid #F5F0E6;} .mtbl tr.ccat td{background:#F4EFE6;color:var(--green-d);font-weight:800;font-size:11px;padding:7px 8px;} .mtbl tr.coff{opacity:.4;}
  .mtbl .l{font-weight:600;color:var(--ink);} .mtbl .ccode{font-size:10px;color:#a7a99f;font-family:ui-monospace,Menlo,monospace;}
  .mtbl .cnum{width:100%;font-family:inherit;font-size:12.5px;text-align:right;background:#FBF9F4;border:1px solid var(--cream-line);border-radius:6px;padding:6px 7px;color:var(--ink);}
  .mtbl .cnetc{font-weight:700;color:var(--green-d);white-space:nowrap;}
  .colqty{width:70px;} .colpct{width:78px;}
  .cfin{background:#FBF9F4;border:1px solid var(--cream-line);border-radius:12px;padding:14px 16px;margin-top:14px;} .cfinh{font-size:15px;font-weight:800;color:var(--green-d);}
  .cfin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;} .cfin-grid .fld{margin-bottom:0;}
  .cfin-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px;} .cfin-out .b{background:#fff;border:1px solid var(--cream-line);border-radius:10px;padding:10px 12px;} .cfin-out .b .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;} .cfin-out .b .v{font-size:17px;font-weight:800;color:var(--green-d);margin-top:2px;font-variant-numeric:tabular-nums;}
</style>

<body>
<header>
  <span class="ttl">📍 Sites Acquisition</span>
  <span class="spacer"></span>
  <span id="hdrActions"></span>
  <a class="btn btn-ghost" href="laundre-portal.html">← Portal</a>
</header>
<main>
  <div id="view"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
var CSRF=window.LAUNDRE_CSRF||'';
function hdrs(j){var h={'Accept':'application/json','X-Requested-With':'XMLHttpRequest'};if(j){h['Content-Type']='application/json';h['X-CSRF-TOKEN']=CSRF;}return h;}
function apiGet(u){return fetch(u,{headers:hdrs(false),credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;});}
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function money(n){return '$'+Math.round(+n||0).toLocaleString('en-AU');}
function fdate(d){ if(!d)return ''; var x=new Date((''+d).slice(0,10)+'T00:00'); return isNaN(x)?'':x.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}); }

var KEY='site_acq_v1', PDKEY='project_delivery_v1';
var STATE={sites:[]}, LOCS=[], USERS=[], cur=null, dirty=false, map=null, layers=[], listMap=null;

/* Stage definitions. "accepted" is a status-only stage (auto-set on signing) — not shown in the step bar. */
var STAGES=[
  {k:'intake', t:'Agent email', fields:[
    {k:'agent_email',l:"Agent's email (paste the offer or reply)",ta:1},
    {k:'centre',l:'Centre / building',half:1},{k:'tenancy',l:'Tenancy',half:1},
    {k:'contact_name',l:'Key contact name',half:1},{k:'contact_company',l:'Company / agency',half:1},
    {k:'contact_phone',l:'Contact phone',half:1},{k:'contact_email',l:'Contact email',half:1},
    {k:'intake_notes',l:'Notes',ta:1}]},
  {k:'location', t:'Location & territory', map:1, fields:[
    {k:'suburb',l:'Suburb',half:1},{k:'state',l:'State',half:1},
    {k:'lat',l:'Latitude',half:1},{k:'lng',l:'Longitude',half:1},
    {k:'radius',l:'Protected radius (km)',half:1,type:'number'},{k:'population',l:'Catchment population',half:1},
    {k:'territory_notes',l:'Territory & suburb notes',ta:1}]},
  {k:'more_info', t:'More information', fields:[
    {k:'keys_date',l:'Keys date',type:'date',half:1},{k:'fitout_date',l:'Fit-out start',type:'date',half:1},
    {k:'opening_date',l:'Opening date',type:'date',half:1},
    {k:'competitors',l:'Competitors within catchment (name, distance, size)',ta:1},
    {k:'competitor_verdict',l:'Verdict on competition',ta:1},
    {k:'growth',l:'Growth outlook (development, population trend, demand)',ta:1},
    {k:'terms_theirs',l:"Landlord's terms (rent, term, options, incentive)",ta:1},
    {k:'terms_suggested',l:'Suggested terms',ta:1},
    {k:'flags',l:'Flags / risks (power, water, gas, trade waste, access)',ta:1},
    {k:'works_landlord',l:'Works — landlord scope',ta:1},
    {k:'works_laundre',l:'Works — Laundré needs',ta:1}]},
  {k:'floorplan', t:'Floor plan', img:1, fields:[
    {k:'floorplan_link',l:'Floor plan / mock-up link'},
    {k:'floorplan_notes',l:'Layout notes',ta:1}]},
  {k:'price', t:'Cost Calculator', calc:1, fields:[
    {k:'price_notes',l:'Pricing notes',ta:1}]},
  {k:'notes', t:'Notes', fields:[
    {k:'notes',l:'General notes',ta:1}]},
  {k:'package', t:'Package & preview', pkg:1, fields:[]},
  {k:'allocation', t:'Send / allocate', alloc:1, fields:[]},
  {k:'accepted', t:'Accepted', status:1, fields:[]}
];
function stageIdx(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i].k===k)return i;return 0;}

/* ---------- persistence ---------- */
function load(){
  return Promise.all([apiGet('/settings-api/'+KEY),apiGet('/locations-api').catch(function(){return[];}),apiGet('/users-api').catch(function(){return[];})]).then(function(r){
    var v=r[0]; if(v&&v.sites&&Array.isArray(v.sites)) STATE=v; LOCS=r[1]||[]; USERS=(r[2]||[]).filter(function(u){return u&&u.email;});
  });
}
function save(){
  var b=document.getElementById('saveBtn'); if(b){b.disabled=true;b.textContent='Saving…';}
  return fetch('/settings-api/'+KEY,{method:'PUT',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({value:STATE})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(){ dirty=false; if(b){b.disabled=false;b.textContent='Save';} var n=document.getElementById('saveNote'); if(n)n.textContent='Saved ✓'; syncSupplier(cur); })
    .catch(function(e){ if(b){b.disabled=false;b.textContent='Save';} alert('Could not save: '+e.message); throw e; });
}
/* Auto-add a site's key contact into Suppliers & Contacts (once). */
function syncSupplier(s){
  if(!s||!s.f)return; var f=s.f; if(f.supplier_synced||!f.contact_name)return;
  var nm=f.contact_company||f.contact_name;
  fetch('/suppliers-api',{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({
    name:nm,category:'Site acquisition contact',contact:f.contact_name,phone:f.contact_phone||'',email:f.contact_email||'',
    notes:'Auto-added from Sites Acquisition — '+(s.name||'site')
  })}).then(function(r){ if(r.ok){ f.supplier_synced=true; } }).catch(function(){});
}
function markDirty(){ dirty=true; var n=document.getElementById('saveNote'); if(n)n.textContent='Unsaved changes'; }

/* ---------- list view: map + filterable table ---------- */
function renderList(){
  cur=null; if(map){map=null;} document.getElementById('hdrActions').innerHTML='<button class="btn btn-green" id="newSite">+ New site</button>';
  var v=document.getElementById('view');
  v.innerHTML='<p class="lead">Every prospective site on one map, with a filterable table below. Open a site to work through territory, terms, pricing, packaging and sign-off — a signed quote becomes a Live Laundromat with a Project Delivery timeline automatically.</p>'
    +'<div class="panel" style="padding:14px"><div id="listMap" style="height:340px;border-radius:10px;border:1px solid var(--cream-line)"></div>'
    +'<div class="maplegend"><span class="dot" style="background:#C4703F"></span>Prospective sites &nbsp; <span class="dot" style="background:#435E53"></span>Live Laundromats</div></div>'
    +'<div class="bar" style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px">'
    +'<input id="tq" placeholder="Search name, suburb, state…" style="min-width:220px;font-family:inherit;font-size:13px;border:1px solid var(--cream-line);border-radius:8px;padding:9px 12px;background:#fff">'
    +'<select id="tStage" style="font-family:inherit;font-size:13px;border:1px solid var(--cream-line);border-radius:8px;padding:9px 12px;background:#fff"><option value="">All stages</option>'+STAGES.map(function(x){return '<option value="'+x.k+'">'+esc(x.t)+'</option>';}).join('')+'</select></div>'
    +'<table style="width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--cream-line);border-radius:12px;overflow:hidden">'
    +'<thead><tr>'+['Name','Suburb','State','Radius','Turnkey','Stage'].map(function(h){return '<th style="background:#33473D;color:#EAF0EC;font-size:11px;text-transform:uppercase;text-align:left;padding:10px 12px">'+h+'</th>';}).join('')+'</tr></thead><tbody id="siteRows"></tbody></table>';
  document.getElementById('newSite').onclick=function(){ var s={id:uid(),name:'',stage:'intake',f:{radius:3},created:new Date().toISOString()}; STATE.sites.push(s); markDirty(); openSite(s.id); };
  ['tq','tStage'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('input',renderRows);});
  renderRows(); drawListMap();
}
function renderRows(){
  var q=(document.getElementById('tq')&&document.getElementById('tq').value||'').toLowerCase();
  var stg=document.getElementById('tStage')&&document.getElementById('tStage').value||'';
  var body=document.getElementById('siteRows'); if(!body)return;
  var list=STATE.sites.filter(function(s){
    if(stg&&(s.stage||'intake')!==stg)return false;
    if(q){var hay=((s.name||'')+' '+((s.f&&s.f.suburb)||'')+' '+((s.f&&s.f.state)||'')+' '+((s.f&&s.f.address)||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  if(!list.length){ body.innerHTML='<tr><td colspan="6" style="padding:26px;text-align:center;color:var(--muted)">No sites'+(q||stg?' match':' yet')+'. Use “+ New site”.</td></tr>'; return; }
  body.innerHTML=list.map(function(s){
    var st=STAGES[stageIdx(s.stage||'intake')], f=s.f||{};
    var cls=s.stage==='accepted'?'done':(s.stage==='package'||s.stage==='allocation'?'pkg':'');
    return '<tr class="srow" data-open="'+s.id+'" style="cursor:pointer">'
      +'<td style="padding:11px 12px;border-bottom:1px solid #F1ECE1;font-size:13.5px"><b>'+esc(s.name||'Untitled site')+'</b></td>'
      +'<td style="padding:11px 12px;border-bottom:1px solid #F1ECE1;font-size:13.5px">'+esc(f.suburb||'—')+'</td>'
      +'<td style="padding:11px 12px;border-bottom:1px solid #F1ECE1;font-size:13.5px">'+esc(f.state||'—')+'</td>'
      +'<td style="padding:11px 12px;border-bottom:1px solid #F1ECE1;font-size:13.5px">'+(f.radius?esc(f.radius)+' km':'—')+'</td>'
      +'<td style="padding:11px 12px;border-bottom:1px solid #F1ECE1;font-size:13.5px">'+(f.turnkey_price?money(f.turnkey_price):'—')+'</td>'
      +'<td style="padding:11px 12px;border-bottom:1px solid #F1ECE1"><span class="pill '+cls+'">'+esc(st.t)+'</span></td></tr>';
  }).join('');
  body.querySelectorAll('.srow').forEach(function(r){r.onclick=function(){openSite(r.dataset.open);};});
}
function drawListMap(){
  var el=document.getElementById('listMap'); if(!el||!window.L)return;
  if(listMap){listMap.remove();listMap=null;}
  listMap=L.map('listMap',{scrollWheelZoom:false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(listMap);

function pickRow(sqm){var best=TABLE[0],bd=1e9;TABLE.forEach(function(r){var d=Math.abs(r.sqm-(+sqm||0));if(d<bd){bd=d;best=r;}});return best;}
function fitoutDefault(sqm){return Math.round((2208*(+sqm||0)+15360)/100)*100;}
function AUD(n){return '$'+Math.round(+n||0).toLocaleString('en-AU');}

function calcInit(s){
  if(s.f.calc&&s.f.calc.machState) return s.f.calc;
  var C={sqm:+s.f.sqm||0,fitout:+s.f.fitout||0,machState:{},plinth:true,delivery:true,install:true,globalDisc:0,fin:{dep:15,term:5,rate:9,freq:12}};
  // Delivery + Installation are auto-included (qty 1). Discounts start at 0 — a single
  // global discount (C.globalDisc, %) applies across all lines, not per machine.
  CAT.forEach(function(x){if(x.code)C.machState[x.code]={qty:(x.type==='delivery'||x.type==='install')?1:0};});

function autoPlinths(C){
  CAT.forEach(function(x){if(x.type==='plinth'&&C.machState[x.code])C.machState[x.code].qty=0;});
  CAT.forEach(function(x){if(x.type==='washer'&&x.plinth&&C.machState[x.plinth]){C.machState[x.plinth].qty+=(C.machState[x.code].qty||0);}});
}
function calcNet(C){

  var list=0,net=0,equip=0,items=[],anyMach=false;
  CAT.forEach(function(x){ if(!x.code)return; var st=C.machState[x.code]||{qty:0};
    var dis=(x.type==='plinth'&&!C.plinth)||(x.type==='delivery'&&!C.delivery)||(x.type==='install'&&!C.install);
    if(dis)return;
    var l=x.unit*(st.qty||0), n=l*(1-gd);

    if(x.type!=='delivery'&&x.type!=='install') equip+=n;
    if((st.qty||0)>0){ items.push({code:x.code,name:x.name,qty:st.qty,net:n}); if(x.type==='washer'||x.type==='dryer'||x.type==='stackwd')anyMach=true; }
  });

}

}

  s.f.machines=sm.r.items.filter(function(i){return i.code!=='Delivery'&&i.code!=='Installation'&&CAT.filter(function(x){return x.code===i.code;})[0].type!=='plinth';}).map(function(i){return {name:i.name,qty:i.qty,code:i.code};});

function financeCalc(amt,fin){
  var dep=Math.min(100,Math.max(0,+fin.dep||0)),term=Math.max(0,+fin.term||0),rate=Math.max(0,+fin.rate||0),freq=+fin.freq||12;
  var deposit=amt*dep/100, principal=amt-deposit, n=term*freq, i=(rate/100)/freq, pay=0;
  if(n>0)pay=i>0?principal*i/(1-Math.pow(1+i,-n)):principal/n;
  return {pay:pay,deposit:deposit,repaid:pay*n,allIn:deposit+pay*n,freq:freq};
}

function calcStep3(s,C){

  var sizeRows=TABLE.map(function(x){return '<tr'+(x.sqm===pickRow(C.sqm).sqm?' class="hit"':'')+'><td>'+x.sqm+'m²</td><td>'+x.units+'</td><td>'+x.washers+'</td><td>'+x.dryers+'</td><td class="r">'+AUD(x.totalEx)+'</td></tr>';}).join('');

function wireCalc(){
  var host=document.getElementById('calcBody'); if(!host)return; var s=cur, C=s.f.calc;

  document.querySelectorAll('[data-cstep]').forEach(function(el){el.onclick=function(){var n=+el.dataset.cstep;if(n>1&&!(C.sqm>0)){alert('Enter the tenancy size first.');return;}s._cstep=n;renderEditor();};});
  document.querySelectorAll('[data-cnav]').forEach(function(b){b.onclick=function(){
    if(b.dataset.cnav==='next'){ if(s._cstep===1&&!(C.sqm>0)){alert('Enter the tenancy size first.');return;} if(s._cstep===1&&!C.fitout)C.fitout=fitoutDefault(C.sqm); s._cstep=Math.min(4,s._cstep+1); }
    else s._cstep=Math.max(1,s._cstep-1);
    renderEditor();
  };});
  // step 1
  var sq=document.getElementById('c_sqm'); if(sq)sq.addEventListener('input',function(){C.sqm=parseFloat(sq.value)||0;calcCommit(s);});
  // step 2
  var fo=document.getElementById('c_fitout'); if(fo)fo.addEventListener('input',function(){C.fitout=parseFloat(fo.value)||0;calcRefresh2(s);});
  // step 3 machine quantities
  document.querySelectorAll('.cnum[data-f="qty"]').forEach(function(inp){inp.addEventListener('input',function(){
    var c=inp.dataset.code,v=parseFloat(inp.value);if(isNaN(v))v=0;
    C.machState[c].qty=Math.max(0,Math.round(v));
    calcRefresh3(s);
  });});
  // single global discount % — applies across every line
  var gdi=document.getElementById('c_globaldisc'); if(gdi)gdi.addEventListener('input',function(){C.globalDisc=Math.min(100,Math.max(0,parseFloat(gdi.value)||0));calcRefresh3(s);});
  document.querySelectorAll('[data-tog]').forEach(function(cb){cb.onchange=function(){C[cb.dataset.tog]=cb.checked;markDirty();renderEditor();};});
  // step 4 finance
  ['fin_amt','fin_dep','fin_term','fin_rate','fin_freq'].forEach(function(id){var e=document.getElementById(id);if(e)e.addEventListener('input',function(){
    C.fin.amt=parseFloat(document.getElementById('fin_amt').value)||0;
    C.fin.dep=parseFloat(document.getElementById('fin_dep').value)||0;
    C.fin.term=parseFloat(document.getElementById('fin_term').value)||0;
    C.fin.rate=parseFloat(document.getElementById('fin_rate').value)||0;
    C.fin.freq=parseInt(document.getElementById('fin_freq').value)||12;
    calcRefreshFin(s);markDirty();
  });});
  calcCommit(s);
}

/* ---------- map + overlap ---------- */
function haversine(a,b,c,d){var R=6371,t=Math.PI/180,dx=(c-a)*t,dy=(d-b)*t,x=Math.sin(dx/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dy/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function drawMap(){
  var el=document.getElementById('map'); if(!el||!window.L)return;
  var lat=parseFloat(cur.f.lat), lng=parseFloat(cur.f.lng), rad=parseFloat(cur.f.radius)||3;
  if(!map){ map=L.map('map',{scrollWheelZoom:false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map); }
  layers.forEach(function(l){map.removeLayer(l);}); layers=[];
  var pts=[];
  LOCS.forEach(function(l){ if(l.lat&&l.lng){ var m=L.circleMarker([l.lat,l.lng],{radius:6,color:'#435E53',fillColor:'#435E53',fillOpacity:.9}).addTo(map).bindPopup(esc(l.name)); var c=L.circle([l.lat,l.lng],{radius:((+l.radius||3)*((l.unit==='m')?1:1000)),color:'#435E53',weight:1,fillOpacity:.06}).addTo(map); layers.push(m,c); pts.push([l.lat,l.lng]); } });
  var ov=document.getElementById('overlap');
  if(!isNaN(lat)&&!isNaN(lng)){
    var m=L.circleMarker([lat,lng],{radius:8,color:'#C4703F',fillColor:'#C4703F',fillOpacity:1}).addTo(map).bindPopup(esc(cur.name||'This site'));
    var c=L.circle([lat,lng],{radius:rad*1000,color:'#C4703F',weight:2,fillOpacity:.1}).addTo(map); layers.push(m,c); pts.push([lat,lng]);
    var clash=null;
    LOCS.forEach(function(l){ if(l.lat&&l.lng){ var d=haversine(lat,lng,+l.lat,+l.lng); var lr=(+l.radius||3); if(d < (rad+lr)){ if(!clash||d<clash.d)clash={name:l.name,d:d}; } } });
    if(ov)ov.innerHTML = clash ? '<div class="overlap clash">⚠ Overlaps '+esc(clash.name)+' — '+clash.d.toFixed(1)+' km away. Review territory.</div>'
                                : '<div class="overlap clear">✓ No overlap with existing Laundré catchments.</div>';
  } else if(ov){ ov.innerHTML='<div class="overlap" style="background:#F1ECE1;color:#8a9790">Search an address (or add latitude &amp; longitude) to check territory overlap.</div>'; }
  if(pts.length){ try{ map.fitBounds(pts,{padding:[30,30],maxZoom:12}); }catch(e){ map.setView(pts[0],11); } } else { map.setView([-25.5,152.7],9); }
  setTimeout(function(){map.invalidateSize();},60);
}

});
function sendProposal(){
  var s=cur, note=document.getElementById('sendNote'); if(!s.f.assigned_email){ alert('Add an assigned email in the Recipient field first.'); return; }
  if(!s.shareToken)s.shareToken=uid()+uid();
  e_disable('sendProposalNav',true); if(note)note.textContent='Sending…';
  var body={event:'site_proposal',to:[s.f.assigned_email],subject:'Your Laundré site quote & proposal — '+(s.name||''),
    heading:'Your site proposal',summary:'See attached your site quote and proposal for '+(s.name||'your site')+'.',
    lines:[['Site',s.name||''],['Suburb',s.f.suburb||''],['Turnkey price',s.f.turnkey_price?money(s.f.turnkey_price)+' ex GST':''],['Proposal link',location.origin+'/site-proposal/'+(s.shareToken||'')]],
    note:'Open the link to review and sign online.'};
  fetch('/notify-api/send',{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return{};}).then(function(j){return{ok:r.ok,j:j};});})
    .then(function(o){ s.f.proposal_sent_at=new Date().toISOString(); if(s.stage!=='accepted')s.stage='allocation'; markDirty();
      // Auto-save, then return to the sites list.
      save().then(function(){ renderList(); }).catch(function(){ e_disable('sendProposalNav',false); if(note)note.textContent='Sent, but could not save — try Save.'; }); })
    .catch(function(){ e_disable('sendProposalNav',false); if(note)note.textContent='Could not send. Check the connection and try again.'; });
}
function e_disable(id,v){var el=document.getElementById(id);if(el)el.disabled=v;}

window.addEventListener('beforeunload',function(e){ if(dirty){e.preventDefault();e.returnValue='';} });
load().then(renderList).catch(function(e){ document.getElementById('view').innerHTML='<p class="lead">Could not load: '+esc(e.message)+'</p>'; });
</script>
