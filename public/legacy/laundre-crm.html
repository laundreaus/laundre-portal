<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundre CRM — Franchisee Pipeline</title>
<script>(function(){var a=localStorage.getItem('laundre_auth')==='1',s=null;try{s=JSON.parse(localStorage.getItem('laundre_session')||'null');}catch(e){}if(!a||(s&&s.role&&s.role!=='admin'))location.replace('laundre-portal.html');})();</script>
<style>
  :root{
    /* Laundré brand palette: sage green + warm cream + near-black */
    --bg:#f0f0ea; --panel:#ffffff; --panel2:#fafaf7; --line:#e4e4dc;
    --text:#101828; --muted:#758696; --faint:#91a293;
    --accent:#435e53; --accent2:#3a5449; --warn:#c08a3e; --danger:#c0392b; --good:#435e53;
    --on-accent:#f0f0ea;
    --shadow:0 8px 30px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  /* layout */
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#ffffff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.3px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:900}
  .brand small{color:var(--muted);font-weight:500;font-size:11px;display:block;letter-spacing:.5px}
  header .spacer{flex:1}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line)}
  .tabs button{background:transparent;border:0;color:var(--muted);padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px}
  .tabs button.active{background:var(--accent);color:var(--on-accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:var(--on-accent)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:12px}
  input,select,textarea{font-family:inherit;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .search{max-width:280px}
  main{padding:18px 20px 60px}
  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:26px;font-weight:800;margin-top:6px}
  .stat .sub{color:var(--faint);font-size:12px;margin-top:2px}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h3{margin:0 0 12px;font-size:14px}
  .funnel-row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .funnel-row .lbl{width:130px;color:var(--muted);font-size:12px;font-weight:600}
  .funnel-bar{flex:1;height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
  .funnel-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .funnel-row .cnt{width:30px;text-align:right;font-weight:700;font-size:13px}
  .listrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border:0}
  .listrow .nm{flex:1;font-weight:600}
  .listrow .meta{color:var(--faint);font-size:12px}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  /* board */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px}
  .col{flex:0 0 270px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
  .col-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0}
  .col-head .dot{width:9px;height:9px;border-radius:50%}
  .col-head .t{font-weight:700;font-size:13px;flex:1}
  .col-head .n{background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .col-body{padding:10px;overflow-y:auto;flex:1;min-height:60px}
  .col-body.drag-over{background:rgba(67,94,83,.07);outline:2px dashed var(--accent);outline-offset:-6px;border-radius:10px}
  .fcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;cursor:grab}
  .fcard:hover{border-color:var(--faint)}
  .fcard.dragging{opacity:.45}
  .fcard .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
  .fcard .loc{color:var(--muted);font-size:12px;margin-top:3px}
  .fcard .frow{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
  .fcard .fee{font-weight:700;font-size:12px;color:var(--accent)}
  .prog{height:5px;background:var(--bg);border-radius:4px;margin-top:9px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--good);border-radius:4px}
  .avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.18s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .drawer.open{transform:none}
  .drawer-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .drawer-head .x{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:22px;line-height:1}
  .drawer-body{overflow-y:auto;padding:16px 18px;flex:1}
  .section{margin-bottom:22px}
  .section h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent)}
  .field{margin-bottom:10px}
  .field label{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .check{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
  .check input{width:auto}
  .check.done span{text-decoration:line-through;color:var(--faint)}
  .check .when{margin-left:auto;color:var(--faint);font-size:11px}
  .log{list-style:none;margin:0;padding:0}
  .log li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log li .when{color:var(--faint);font-size:11px}
  .addlog{display:flex;gap:8px;margin-top:8px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .muted{color:var(--muted)}
  .empty{color:var(--faint);text-align:center;padding:40px;font-size:13px}
  /* table */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none}
  tbody tr:hover{background:var(--panel2)}
  tbody tr{cursor:pointer}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.2s;font-weight:600;font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">L</div><div>Laundre CRM<small>FRANCHISEE PIPELINE</small></div></div>
  <div class="tabs" id="tabs">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="board">Pipeline</button>
    <button data-view="table">Directory</button>
  </div>
  <div class="spacer"></div>
  <input class="search" id="search" placeholder="Search franchisees…">
  <button class="btn primary" id="addBtn">+ Add Franchisee</button>
  <button class="btn ghost sm" id="menuBtn" title="Data">⋯</button>
  <a class="btn ghost sm" href="laundre-portal.html" title="Back to portal" style="text-decoration:none">⌂ Portal</a>
</header>

<main>
  <div id="view-dashboard"></div>
  <div id="view-board" style="display:none"></div>
  <div id="view-table" style="display:none"></div>
</main>

<!-- Drawer -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Config ---------- */
const STAGES = [
  {id:'inquiry',    name:'Inquiry',           color:'#91a293'},
  {id:'discovery',  name:'Discovery Call',    color:'#6b8e9e'},
  {id:'financials', name:'Financials Reviewed',color:'#5b7c8a'},
  {id:'approved',   name:'Approved',          color:'#8a7fa3'},
  {id:'onboarding', name:'Onboarding',        color:'#c08a3e'},
  {id:'active',     name:'Active',            color:'#435e53'},
  {id:'atrisk',     name:'At-Risk',           color:'#c0392b'},
  {id:'renewal',    name:'Renewal',           color:'#3a5449'},
  {id:'expansion',  name:'Expansion',         color:'#b5836b'},
];
const STAGE = Object.fromEntries(STAGES.map(s=>[s.id,s]));
const ONBOARD_STEPS = ['Franchise agreement signed','Location secured / lease','Build-out & equipment','Staff hired','Operations training','POS & systems setup','Marketing launch kit','Grand opening'];
const OWNERS = ['Maya Chen','Dev Patel','Sofia Romano','Jordan Blake'];
const STORE_KEY = 'laundre_crm_v1';

/* ---------- Seed data ---------- */
function seed(){
  const mk=(o)=>Object.assign({id:crypto.randomUUID(),onboarding:[],activity:[],notes:''},o);
  const ob=(n)=>ONBOARD_STEPS.map((s,i)=>({step:s,done:i<n,date:i<n?daysAgo(40-i*3):''}));
  const log=(arr)=>arr.map(a=>({text:a[0],when:a[1],who:a[2]||'System'}));
  return [
    mk({name:'Brightwash Downtown',contact:'Aaron Diaz',email:'aaron@brightwash.co',phone:'(312) 555-0142',city:'Chicago, IL',territory:'IL-Central',address:'820 W Lake St, Chicago, IL',stage:'active',owner:'Maya Chen',fee:35000,royalty:6,investment:410000,revenue:48200,paymentStatus:'Current',openDate:'2025-02-11',nextAction:'Q2 business review',nextActionDate:nextDays(9),onboarding:ob(8),notes:'Top quartile store. Interested in a second unit.',activity:log([['Royalty payment received — $2,892','2026-06-02','System'],['Quarterly review scheduled','2026-05-20','Maya Chen']])}),
    mk({name:'SudsCity Riverside',contact:'Priya Nair',email:'priya@sudscity.com',phone:'(916) 555-0188',city:'Sacramento, CA',territory:'CA-North',address:'1450 Riverside Blvd, Sacramento, CA',stage:'atrisk',owner:'Dev Patel',fee:35000,royalty:6,investment:395000,revenue:21400,paymentStatus:'30 days late',openDate:'2024-09-03',nextAction:'Recovery call — declining traffic',nextActionDate:nextDays(2),onboarding:ob(8),notes:'Revenue down 28% QoQ. Equipment downtime reported in May.',activity:log([['Flagged at-risk — late royalty','2026-06-10','Dev Patel'],['Owner reported dryer breakdown','2026-05-28','Priya Nair']])}),
    mk({name:'Laundre Pearl District',contact:'Tom H.',email:'tom@example.com',phone:'(503) 555-0117',city:'Portland, OR',territory:'OR-Metro',address:'—',stage:'onboarding',owner:'Sofia Romano',fee:35000,royalty:6,investment:380000,revenue:0,paymentStatus:'N/A',openDate:'',nextAction:'Equipment install walkthrough',nextActionDate:nextDays(5),onboarding:ob(4),notes:'Lease signed. Build-out underway, targeting Aug open.',activity:log([['Lease secured','2026-05-30','Sofia Romano'],['Agreement signed','2026-05-12','System']])}),
    mk({name:'FreshFold Tempe',contact:'Carla Mendez',email:'carla@freshfold.io',phone:'(480) 555-0163',city:'Tempe, AZ',territory:'AZ-Phoenix',address:'—',stage:'approved',owner:'Jordan Blake',fee:35000,royalty:6,investment:0,revenue:0,paymentStatus:'N/A',openDate:'',nextAction:'Send franchise agreement',nextActionDate:nextDays(3),onboarding:ob(0),notes:'Approved by committee. Strong financials, 2 sites scouted.',activity:log([['Approved by franchise committee','2026-06-08','Jordan Blake']])}),
    mk({name:'WashWorks Austin',contact:'Leah Park',email:'leah@washworks.com',phone:'(512) 555-0199',city:'Austin, TX',territory:'TX-Central',address:'—',stage:'financials',owner:'Maya Chen',fee:35000,royalty:6,investment:0,revenue:0,paymentStatus:'N/A',openDate:'',nextAction:'Review proof of funds',nextActionDate:nextDays(4),onboarding:ob(0),notes:'Liquid capital verified at $180k. Awaiting credit check.',activity:log([['Financials submitted','2026-06-09','Leah Park']])}),
    mk({name:'Bubble & Co.',contact:'Marcus Lee',email:'marcus@bubbleco.com',phone:'(206) 555-0124',city:'Seattle, WA',territory:'WA-Sound',address:'—',stage:'discovery',owner:'Dev Patel',fee:35000,royalty:6,investment:0,revenue:0,paymentStatus:'N/A',openDate:'',nextAction:'Discovery call #2',nextActionDate:nextDays(1),onboarding:ob(0),notes:'Existing laundromat owner exploring conversion.',activity:log([['Intro discovery call held','2026-06-05','Dev Patel']])}),
    mk({name:'SpinHouse Denver',contact:'Nina Okafor',email:'nina@spinhouse.co',phone:'(720) 555-0150',city:'Denver, CO',territory:'CO-Front',address:'—',stage:'inquiry',owner:'Sofia Romano',fee:35000,royalty:6,investment:0,revenue:0,paymentStatus:'N/A',openDate:'',nextAction:'Qualify lead — send FDD',nextActionDate:nextDays(2),onboarding:ob(0),notes:'Inbound from website. Has retail location available.',activity:log([['Inbound inquiry received','2026-06-13','System']])}),
    mk({name:'Brightwash Lakeview',contact:'Aaron Diaz',email:'aaron@brightwash.co',phone:'(312) 555-0142',city:'Chicago, IL',territory:'IL-Central',address:'—',stage:'expansion',owner:'Maya Chen',fee:25000,royalty:6,investment:0,revenue:0,paymentStatus:'N/A',openDate:'',nextAction:'Territory approval for unit #2',nextActionDate:nextDays(6),onboarding:ob(0),notes:'Multi-unit expansion for existing top operator (Downtown).',activity:log([['Expansion request submitted','2026-06-07','Aaron Diaz']])}),
    mk({name:'CleanCycle Miami',contact:'Rosa Fuentes',email:'rosa@cleancycle.com',phone:'(305) 555-0171',city:'Miami, FL',territory:'FL-South',address:'77 Brickell Ave, Miami, FL',stage:'renewal',owner:'Jordan Blake',fee:35000,royalty:6,investment:420000,revenue:39800,paymentStatus:'Current',openDate:'2021-04-19',nextAction:'5-year renewal paperwork',nextActionDate:nextDays(12),onboarding:ob(8),notes:'Original agreement up for 5-year renewal. Solid operator.',activity:log([['Renewal window opened','2026-06-01','System'],['Royalty payment received — $2,388','2026-06-01','System']])}),
    mk({name:'Laundre Harbor East',contact:'Greg Sims',email:'greg@example.com',phone:'(410) 555-0133',city:'Baltimore, MD',territory:'MD-East',address:'1201 Fleet St, Baltimore, MD',stage:'active',owner:'Sofia Romano',fee:35000,royalty:6,investment:388000,revenue:33100,paymentStatus:'Current',openDate:'2023-11-08',nextAction:'Monthly check-in',nextActionDate:nextDays(15),onboarding:ob(8),notes:'Steady performer. No issues.',activity:log([['Royalty payment received — $1,986','2026-06-01','System']])}),
  ];
}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function nextDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

/* ---------- State ---------- */
let DATA = [];
let VIEW = 'dashboard';
let QUERY = '';
let sortKey='name', sortDir=1;

function load(){
  try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r);}catch(e){}
  const s=seed();save(s);return s;
}
function save(d){DATA=d||DATA;try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA));}catch(e){}}
function byId(id){return DATA.find(f=>f.id===id)}
function filtered(){
  const q=QUERY.trim().toLowerCase();
  if(!q)return DATA;
  return DATA.filter(f=>[f.name,f.contact,f.city,f.territory,f.owner,f.email].join(' ').toLowerCase().includes(q));
}
function progress(f){const t=f.onboarding||[];if(!t.length)return 0;return Math.round(t.filter(x=>x.done).length/t.length*100)}
function initials(n){return (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function avatarColor(n){const c=['#435e53','#758a77','#6b8e9e','#8a7fa3','#c08a3e','#b5836b'];let h=0;for(const ch of (n||''))h=ch.charCodeAt(0)+h;return c[h%c.length]}
function money(n){return n?'$'+Number(n).toLocaleString():'—'}
function fmtDate(d){if(!d)return '—';const dt=new Date(d+'T00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function daysUntil(d){if(!d)return null;return Math.round((new Date(d+'T00:00')-new Date().setHours(0,0,0,0))/864e5)}

/* ---------- Render: Dashboard ---------- */
function renderDashboard(){
  const el=document.getElementById('view-dashboard');
  const all=DATA;
  const active=all.filter(f=>['active','renewal'].includes(f.stage));
  const pipeline=all.filter(f=>['inquiry','discovery','financials','approved','onboarding','expansion'].includes(f.stage));
  const atrisk=all.filter(f=>f.stage==='atrisk');
  const mrr=active.reduce((s,f)=>s+ (f.revenue*(f.royalty/100)),0);
  const pipeFee=pipeline.reduce((s,f)=>s+(f.fee||0),0);
  const actions=[...all].filter(f=>f.nextActionDate).sort((a,b)=>a.nextActionDate.localeCompare(b.nextActionDate)).slice(0,7);

  const counts=STAGES.map(s=>({s,n:all.filter(f=>f.stage===s.id).length}));
  const max=Math.max(1,...counts.map(c=>c.n));

  el.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Active Stores</div><div class="v">${active.length}</div><div class="sub">${atrisk.length} at-risk</div></div>
      <div class="stat"><div class="k">In Pipeline</div><div class="v">${pipeline.length}</div><div class="sub">${money(pipeFee)} potential fees</div></div>
      <div class="stat"><div class="k">Est. Monthly Royalties</div><div class="v">${money(Math.round(mrr))}</div><div class="sub">from active stores</div></div>
      <div class="stat"><div class="k">Total Franchisees</div><div class="v">${all.length}</div><div class="sub">across ${new Set(all.map(f=>f.territory)).size} territories</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Pipeline by stage</h3>
        ${counts.map(c=>`
          <div class="funnel-row">
            <div class="lbl">${c.s.name}</div>
            <div class="funnel-bar"><i style="width:${c.n/max*100}%;background:${c.s.color}"></i></div>
            <div class="cnt">${c.n}</div>
          </div>`).join('')}
      </div>
      <div class="card">
        <h3>Upcoming actions</h3>
        ${actions.length?actions.map(f=>{
          const du=daysUntil(f.nextActionDate);
          const tone=du<0?'var(--danger)':du<=2?'var(--warn)':'var(--muted)';
          const when=du<0?`${-du}d overdue`:du===0?'Today':`${du}d`;
          return `<div class="listrow" onclick="openDrawer('${f.id}')">
            <span class="avatar" style="background:${avatarColor(f.owner)}">${initials(f.owner)}</span>
            <div class="nm">${f.nextAction||'—'}<div class="meta">${f.name} · ${STAGE[f.stage].name}</div></div>
            <span class="pill" style="color:${tone};background:rgba(16,24,40,.05)">${when}</span>
          </div>`}).join(''):'<div class="empty">No scheduled actions</div>'}
      </div>
    </div>
    ${atrisk.length?`<div class="card" style="margin-top:16px;border-color:rgba(239,68,68,.4)">
      <h3 style="color:var(--danger)">⚠ At-risk stores</h3>
      ${atrisk.map(f=>`<div class="listrow" onclick="openDrawer('${f.id}')">
        <div class="nm">${f.name}<div class="meta">${f.city} · ${f.paymentStatus} · ${money(f.revenue)}/mo</div></div>
        <span class="pill" style="color:var(--danger);background:rgba(239,68,68,.1)">${f.nextAction||'Needs attention'}</span>
      </div>`).join('')}
    </div>`:''}
  `;
}

/* ---------- Render: Board ---------- */
function renderBoard(){
  const el=document.getElementById('view-board');
  const data=filtered();
  el.innerHTML=`<div class="board">${STAGES.map(s=>{
    const items=data.filter(f=>f.stage===s.id);
    return `<div class="col">
      <div class="col-head"><span class="dot" style="background:${s.color}"></span><span class="t">${s.name}</span><span class="n">${items.length}</span></div>
      <div class="col-body" data-stage="${s.id}">
        ${items.map(cardHTML).join('')||'<div class="empty" style="padding:18px">—</div>'}
      </div>
    </div>`;
  }).join('')}</div>`;
  wireDnD();
}
function cardHTML(f){
  const p=progress(f);
  const du=daysUntil(f.nextActionDate);
  const showProg=['onboarding','approved'].includes(f.stage);
  return `<div class="fcard" draggable="true" data-id="${f.id}" onclick="openDrawer('${f.id}')">
    <div class="nm"><span class="avatar" style="background:${avatarColor(f.owner)}">${initials(f.owner)}</span>${f.name}</div>
    <div class="loc">📍 ${f.city} · ${f.territory}</div>
    <div class="frow">
      <span class="fee">${f.stage==='active'||f.stage==='renewal'?money(f.revenue)+'/mo':money(f.fee)+' fee'}</span>
      ${du!=null?`<span class="muted" style="font-size:11px">${du<0?(-du)+'d overdue':du===0?'Today':'in '+du+'d'}</span>`:''}
    </div>
    ${showProg?`<div class="prog"><i style="width:${p}%"></i></div>`:''}
  </div>`;
}
let dragId=null;
function wireDnD(){
  document.querySelectorAll('.fcard').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.stopPropagation();});
    c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging')});
  });
  document.querySelectorAll('.col-body').forEach(b=>{
    b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('drag-over')});
    b.addEventListener('dragleave',()=>b.classList.remove('drag-over'));
    b.addEventListener('drop',e=>{
      e.preventDefault();b.classList.remove('drag-over');
      const f=byId(dragId);if(!f)return;
      const ns=b.dataset.stage;
      if(f.stage!==ns){
        f.stage=ns;
        f.activity.unshift({text:`Moved to ${STAGE[ns].name}`,when:new Date().toISOString().slice(0,10),who:'You'});
        save();renderBoard();
        if(VIEW==='dashboard')renderDashboard();
        toast(`${f.name} → ${STAGE[ns].name}`);
      }
    });
  });
}

/* ---------- Render: Table ---------- */
function renderTable(){
  const el=document.getElementById('view-table');
  let rows=filtered().slice().sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(sortKey==='stage'){x=STAGES.findIndex(s=>s.id===a.stage);y=STAGES.findIndex(s=>s.id===b.stage);}
    if(typeof x==='string'){x=(x||'').toLowerCase();y=(y||'').toLowerCase();}
    return (x>y?1:x<y?-1:0)*sortDir;
  });
  const cols=[['name','Franchisee'],['contact','Contact'],['city','Location'],['stage','Stage'],['owner','Owner'],['fee','Fee'],['revenue','Revenue'],['paymentStatus','Payment']];
  el.innerHTML=`<div class="card" style="padding:0;overflow:hidden">
    <table>
      <thead><tr>${cols.map(c=>`<th data-k="${c[0]}">${c[1]}${sortKey===c[0]?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(f=>`<tr onclick="openDrawer('${f.id}')">
        <td><b>${f.name}</b></td>
        <td>${f.contact||'—'}</td>
        <td>${f.city||'—'}</td>
        <td><span class="tag" style="color:${STAGE[f.stage].color};background:rgba(16,24,40,.05)">${STAGE[f.stage].name}</span></td>
        <td>${f.owner||'—'}</td>
        <td>${money(f.fee)}</td>
        <td>${f.revenue?money(f.revenue)+'/mo':'—'}</td>
        <td>${f.paymentStatus||'—'}</td>
      </tr>`).join('')||'<tr><td colspan="8" class="empty">No franchisees match.</td></tr>'}</tbody>
    </table>
  </div>`;
  el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}renderTable();});
}

/* ---------- Drawer (detail/edit) ---------- */
let openId=null;
function waitStatus(start){if(!start)return '—';const d=Math.floor((Date.now()-new Date(start+'T00:00'))/864e5);return d>=14?('✓ complete ('+d+' days)'):(d+' / 14 days');}
function chk(id){const e=document.getElementById(id);return !!(e&&e.checked);}
function openDrawer(id){
  openId=id;const f=byId(id);if(!f)return;const pr=f.prospect||{};
  const head=document.getElementById('drawerHead');
  const body=document.getElementById('drawerBody');
  head.innerHTML=`
    <span class="avatar" style="width:36px;height:36px;font-size:14px;background:${avatarColor(f.owner)}">${initials(f.name)}</span>
    <div>
      <div style="font-weight:800;font-size:16px">${f.name}</div>
      <div class="muted" style="font-size:12px">${f.city||'—'} · ${f.territory||''}</div>
    </div>
    <button class="x" onclick="closeDrawer()">×</button>`;
  body.innerHTML=`
    <div class="section">
      <div class="field"><label>Stage</label>
        <select id="d_stage">${STAGES.map(s=>`<option value="${s.id}" ${s.id===f.stage?'selected':''}>${s.name}</option>`).join('')}</select>
      </div>
      <div class="two">
        <div class="field"><label>Owner</label><select id="d_owner">${OWNERS.map(o=>`<option ${o===f.owner?'selected':''}>${o}</option>`).join('')}</select></div>
        <div class="field"><label>Payment status</label><input id="d_pay" value="${f.paymentStatus||''}"></div>
      </div>
    </div>

    <div class="section">
      <h4>Contact &amp; Location</h4>
      <div class="two">
        <div class="field"><label>Store name</label><input id="d_name" value="${esc(f.name)}"></div>
        <div class="field"><label>Primary contact</label><input id="d_contact" value="${esc(f.contact)}"></div>
        <div class="field"><label>Email</label><input id="d_email" value="${esc(f.email)}"></div>
        <div class="field"><label>Phone</label><input id="d_phone" value="${esc(f.phone)}"></div>
        <div class="field"><label>City / State</label><input id="d_city" value="${esc(f.city)}"></div>
        <div class="field"><label>Territory</label><input id="d_territory" value="${esc(f.territory)}"></div>
      </div>
      <div class="field"><label>Store address</label><input id="d_address" value="${esc(f.address)}"></div>
    </div>

    <div class="section">
      <h4>Deal &amp; Financials</h4>
      <div class="two">
        <div class="field"><label>Franchise fee ($)</label><input id="d_fee" type="number" value="${f.fee||0}"></div>
        <div class="field"><label>Royalty (%)</label><input id="d_royalty" type="number" value="${f.royalty||0}"></div>
        <div class="field"><label>Total investment ($)</label><input id="d_investment" type="number" value="${f.investment||0}"></div>
        <div class="field"><label>Monthly revenue ($)</label><input id="d_revenue" type="number" value="${f.revenue||0}"></div>
        <div class="field"><label>Open date</label><input id="d_openDate" type="date" value="${f.openDate||''}"></div>
        <div class="field"><label>Est. monthly royalty</label><input value="${money(Math.round((f.revenue||0)*(f.royalty||0)/100))}" disabled></div>
      </div>
    </div>

    <div class="section">
      <h4>Next Action</h4>
      <div class="two">
        <div class="field"><label>Action</label><input id="d_nextAction" value="${esc(f.nextAction)}"></div>
        <div class="field"><label>Due</label><input id="d_nextActionDate" type="date" value="${f.nextActionDate||''}"></div>
      </div>
    </div>

    <div class="section">
      <h4>Prospect Progress</h4>
      <div class="two">
        <label class="check ${pr.nda?'done':''}"><input type="checkbox" id="d_nda" ${pr.nda?'checked':''}><span>NDA signed</span></label>
        <div class="field"><label>NDA date</label><input id="d_ndaDate" type="date" value="${pr.ndaDate||''}"></div>
        <label class="check ${pr.feePaid?'done':''}"><input type="checkbox" id="d_feePaid" ${pr.feePaid?'checked':''}><span>Application fee paid</span></label>
        <label class="check ${pr.docs?'done':''}"><input type="checkbox" id="d_docs" ${pr.docs?'checked':''}><span>Documents received</span></label>
        <div class="field"><label>14-day wait start</label><input id="d_waitStart" type="date" value="${pr.waitStart||''}"></div>
        <div class="field"><label>Wait status</label><input value="${waitStatus(pr.waitStart)}" disabled></div>
        <label class="check ${pr.called?'done':''}"><input type="checkbox" id="d_called" ${pr.called?'checked':''}><span>Called</span></label>
        <div class="field"><label>Call date</label><input id="d_callDate" type="date" value="${pr.callDate||''}"></div>
        <div class="field"><label>Decision</label><select id="d_decision"><option value="">—</option><option ${pr.decision==='Yes'?'selected':''}>Yes</option><option ${pr.decision==='No'?'selected':''}>No</option></select></div>
        <label class="check ${pr.franchiseFeePaid?'done':''}"><input type="checkbox" id="d_franchiseFeePaid" ${pr.franchiseFeePaid?'checked':''}><span>Franchise fee paid</span></label>
      </div>
    </div>

    <div class="section">
      <h4>Onboarding — ${progress(f)}% complete</h4>
      <div class="prog" style="margin-bottom:12px"><i style="width:${progress(f)}%"></i></div>
      ${(f.onboarding||[]).map((t,i)=>`<label class="check ${t.done?'done':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleStep('${f.id}',${i})">
        <span>${t.step}</span>${t.done&&t.date?`<span class="when">${fmtDate(t.date)}</span>`:''}
      </label>`).join('')}
    </div>

    <div class="section">
      <h4>Notes</h4>
      <textarea id="d_notes" rows="3">${esc(f.notes)}</textarea>
    </div>

    <div class="section">
      <h4>Activity Log</h4>
      <div class="addlog">
        <input id="d_newlog" placeholder="Log a call, email, or note…">
        <button class="btn sm" onclick="addLog('${f.id}')">Add</button>
      </div>
      <ul class="log">${(f.activity||[]).map(a=>`<li>${esc(a.text)}<div class="when">${fmtDate(a.when)} · ${a.who||''}</div></li>`).join('')||'<li class="muted">No activity yet.</li>'}</ul>
    </div>

    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn primary" style="flex:1" onclick="saveDrawer()">Save changes</button>
      <button class="btn" onclick="deleteFranchisee('${f.id}')" style="color:var(--danger)">Delete</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){openId=null;document.getElementById('overlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function saveDrawer(){
  const f=byId(openId);if(!f)return;
  const prevStage=f.stage;
  Object.assign(f,{
    stage:val('d_stage'),owner:val('d_owner'),paymentStatus:val('d_pay'),
    name:val('d_name'),contact:val('d_contact'),email:val('d_email'),phone:val('d_phone'),
    city:val('d_city'),territory:val('d_territory'),address:val('d_address'),
    fee:+val('d_fee'),royalty:+val('d_royalty'),investment:+val('d_investment'),revenue:+val('d_revenue'),
    openDate:val('d_openDate'),nextAction:val('d_nextAction'),nextActionDate:val('d_nextActionDate'),notes:val('d_notes'),
    prospect:{nda:chk('d_nda'),ndaDate:val('d_ndaDate'),feePaid:chk('d_feePaid'),docs:chk('d_docs'),
      waitStart:val('d_waitStart'),called:chk('d_called'),callDate:val('d_callDate'),
      decision:val('d_decision'),franchiseFeePaid:chk('d_franchiseFeePaid')}
  });
  if(prevStage!==f.stage)f.activity.unshift({text:`Moved to ${STAGE[f.stage].name}`,when:new Date().toISOString().slice(0,10),who:'You'});
  save();rerender();closeDrawer();toast('Saved');
}
function toggleStep(id,i){
  const f=byId(id);const t=f.onboarding[i];t.done=!t.done;t.date=t.done?new Date().toISOString().slice(0,10):'';
  if(t.done)f.activity.unshift({text:`Completed onboarding: ${t.step}`,when:t.date,who:'You'});
  save();openDrawer(id);if(VIEW!=='board')rerender();
}
function addLog(id){
  const f=byId(id);const v=val('d_newlog').trim();if(!v)return;
  f.activity.unshift({text:v,when:new Date().toISOString().slice(0,10),who:'You'});
  save();openDrawer(id);
}
function deleteFranchisee(id){
  if(!confirm('Delete this franchisee record?'))return;
  DATA=DATA.filter(f=>f.id!==id);save();closeDrawer();rerender();toast('Deleted');
}
function addFranchisee(){
  const f={id:crypto.randomUUID(),name:'New Franchisee',contact:'',email:'',phone:'',city:'',territory:'',address:'',
    stage:'inquiry',owner:OWNERS[0],fee:35000,royalty:6,investment:0,revenue:0,paymentStatus:'N/A',openDate:'',
    nextAction:'Qualify lead',nextActionDate:nextDays(3),notes:'',
    onboarding:ONBOARD_STEPS.map(s=>({step:s,done:false,date:''})),
    activity:[{text:'Record created',when:new Date().toISOString().slice(0,10),who:'You'}]};
  DATA.unshift(f);save();rerender();openDrawer(f.id);
}

/* ---------- Data menu (export/import/reset) ---------- */
function dataMenu(){
  const choice=prompt('Data options:\n1 = Export JSON\n2 = Import JSON\n3 = Export CSV\n4 = Reset to sample data\n\nEnter 1-4:');
  if(choice==='1')exportJSON();
  else if(choice==='2')importJSON();
  else if(choice==='3')exportCSV();
  else if(choice==='4'){if(confirm('Reset all data to the sample set? This erases your changes.')){localStorage.removeItem(STORE_KEY);DATA=seed();save();rerender();toast('Reset to sample data');}}
}
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function exportJSON(){download('laundre-crm-data.json',JSON.stringify(DATA,null,2),'application/json');toast('Exported JSON');}
function exportCSV(){
  const cols=['name','contact','email','phone','city','territory','address','stage','owner','fee','royalty','investment','revenue','paymentStatus','openDate','nextAction','nextActionDate'];
  const head=cols.join(',');
  const rows=DATA.map(f=>cols.map(c=>`"${String(f[c]??'').replace(/"/g,'""')}"`).join(','));
  download('laundre-crm-export.csv',[head,...rows].join('\n'),'text/csv');toast('Exported CSV');
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(Array.isArray(d)){DATA=d;save();rerender();toast('Imported '+d.length+' records');}}catch(err){alert('Invalid JSON file');}};fr.readAsText(e.target.files[0]);};
  inp.click();
}

/* ---------- Plumbing ---------- */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rerender(){if(VIEW==='dashboard')renderDashboard();else if(VIEW==='board')renderBoard();else renderTable();}
function setView(v){
  VIEW=v;
  ['dashboard','board','table'].forEach(x=>document.getElementById('view-'+x).style.display=x===v?'':'none');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  rerender();
}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

document.getElementById('tabs').addEventListener('click',e=>{if(e.target.dataset.view)setView(e.target.dataset.view);});
document.getElementById('search').addEventListener('input',e=>{QUERY=e.target.value;if(VIEW!=='dashboard')rerender();});
document.getElementById('addBtn').addEventListener('click',addFranchisee);
document.getElementById('menuBtn').addEventListener('click',dataMenu);
document.getElementById('overlay').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

DATA = load();
renderDashboard();
window.openDrawer=openDrawer;window.closeDrawer=closeDrawer;window.saveDrawer=saveDrawer;
window.toggleStep=toggleStep;window.addLog=addLog;window.deleteFranchisee=deleteFranchisee;
</script>
</body>
</html>
