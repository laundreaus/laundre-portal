<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laundré · Secure Document</title>
<script>if(localStorage.getItem('laundre_auth')!=='1'){location.replace('laundre-portal.html');}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--ink:#2E3D36;}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#3a3a3a;color:#EAF0EC;overflow:hidden;}
  header{background:var(--green-d);padding:11px 18px;display:flex;align-items:center;gap:12px;height:52px;position:relative;z-index:20;}
  header .logo svg{height:22px;width:auto;display:block;} header .spacer{flex:1;}
  header .tag{font-size:12px;color:#E4A66F;font-weight:700;border:1px solid rgba(228,166,111,.4);border-radius:20px;padding:3px 10px;}
  header a{color:#cfe0d5;font-size:13px;text-decoration:none;margin-left:14px;}
  #stage{position:absolute;top:52px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
  #pages{padding:26px 20% 70px;}                 /* 20% side padding on desktop */
  @media(max-width:760px){ #pages{padding:12px 0 40px;} }  /* full width on mobile */
  .page{position:relative;width:100%;margin:0 auto 20px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.45);border-radius:2px;overflow:hidden;}
  .page canvas{display:block;width:100%;height:auto;}
  .wm{position:fixed;inset:52px 0 0 0;pointer-events:none;z-index:10;opacity:.11;background-repeat:repeat;}
  #shield{position:fixed;inset:0;background:#000;z-index:9999;display:none;color:#EAF0EC;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;}
  #shield.show{display:flex;}
  #shield .lk{font-size:40px;margin-bottom:14px;}
  #loading{position:absolute;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;color:#cfd8d1;font-size:14px;flex-direction:column;gap:12px;}
  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#E4A66F;border-radius:50%;animation:sp 0.8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media print{ html,body{display:none!important;} }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false" oncopy="return false">
<header>
  <span class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="145" height="28.506" viewBox="0 0 145 28.506"><g transform="translate(-1862.4 -927.506)"><path d="M552.01,324.131a12.885,12.885,0,0,1-.315-2.94,8.664,8.664,0,0,1,.145-1.512,6.607,6.607,0,0,1,.484-1.561,3.343,3.343,0,0,1,.907-1.222,2.106,2.106,0,0,1,1.392-.472,1.843,1.843,0,0,1,1.222.435,3.381,3.381,0,0,1,.859,1.126,5.977,5.977,0,0,1,.5,1.5,8.317,8.317,0,0,1,.157,1.585,8.712,8.712,0,0,1-.218,1.911,5.654,5.654,0,0,1-.726,1.778,3.856,3.856,0,0,1-1.331,1.295,3.951,3.951,0,0,1-2.033.484h-.145A9.542,9.542,0,0,1,552.01,324.131Zm6.449,11.447a8.445,8.445,0,0,0,2.492-1.27,6.5,6.5,0,0,0,1.742-1.911,4.547,4.547,0,0,0,.641-2.348,8.254,8.254,0,0,1-1.5.472,7.648,7.648,0,0,1-1.572.157,8.856,8.856,0,0,1-4.126-.944A7.593,7.593,0,0,1,553.172,327h2.178q4.38,0,6.341-1.234a4.02,4.02,0,0,0,1.96-3.63,5.294,5.294,0,0,0-1-3.133,6.884,6.884,0,0,0-2.916-2.263,11.513,11.513,0,0,0-4.671-.847,9.232,9.232,0,0,0-6.9,2.953,9.832,9.832,0,0,0-1.984,3.206,10.8,10.8,0,0,0-.7,3.908,9.773,9.773,0,0,0,.787,3.908,10.177,10.177,0,0,0,5.372,5.372,9.838,9.838,0,0,0,3.933.787,9.389,9.389,0,0,0,2.892-.448Z" transform="translate(1443.75 619.986)" fill="#EAF0EC"/></g></svg></span>
  <span class="tag">🔒 Confidential · View only</span>
  <span class="spacer"></span>
  <span id="dtitle" style="font-size:13px;color:#bcd0c3;"></span>
  <a id="backLink" href="laundre-onboard.html">Back</a>
</header>
<div id="stage"><div id="pages"></div></div>
<div class="wm" id="wm"></div>
<div id="loading"><div class="spin"></div><div id="lmsg">Loading secure document…</div></div>
<div id="shield"><div class="lk">🔒</div><div>Viewing paused</div><div style="opacity:.7;font-size:13px;margin-top:6px">This confidential document is hidden while the window is not in focus.</div></div>
<script>
function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
var ID=qs('id'), DOC=qs('doc');
// ?id= => onboarding document library ; ?doc= => general Documents module
var KEY = ID || DOC;
var SRC = ID ? ('/onboarding-doc/'+encodeURIComponent(ID)) : (DOC ? ('/documents-doc/'+encodeURIComponent(DOC)) : '');
var LIST = ID ? '/onboarding-docs' : '/documents-api';
var CSRF=(window.LAUNDRE_CSRF||'');
document.getElementById('backLink').href = DOC ? 'laundre-documents.html' : 'laundre-onboard.html';
function SESSION(){try{return JSON.parse(localStorage.getItem('laundre_session')||'null')||{};}catch(e){return {};}}
var who=(SESSION().email||SESSION().name||'');

// identity watermark tiled across the document (deters photographing)
(function(){
  var c=document.createElement('canvas');c.width=320;c.height=180;var x=c.getContext('2d');
  x.translate(160,90);x.rotate(-0.35);x.font='13px -apple-system,Arial';x.fillStyle='#000';x.textAlign='center';
  x.fillText('Laundré · Confidential',0,-8);x.fillText(who||'',0,12);
  document.getElementById('wm').style.backgroundImage='url('+c.toDataURL()+')';
})();

var pages=document.getElementById('pages'), stage=document.getElementById('stage');
function fail(msg){var l=document.getElementById('loading');if(l){l.querySelector('.spin').style.display='none';document.getElementById('lmsg').textContent=msg||'Could not load this document.';}}

if(!SRC){ fail('No document specified.'); }
else if(!window.pdfjsLib){ fail('Viewer failed to load — please refresh.'); }
else{
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // set the doc title in the header
  fetch(LIST,{headers:{'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(list){var d=(list||[]).find(function(x){return String(x.id)===String(KEY);});document.getElementById('dtitle').textContent=d?d.title:'';})
    .catch(function(){});

  var pdfDoc=null, pageEls=[], rendered={}, ratio=1.414;
  fetch(SRC,{credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.arrayBuffer(); })
    .then(function(buf){ return pdfjsLib.getDocument({data:buf}).promise; })
    .then(function(doc){
      pdfDoc=doc;
      return doc.getPage(1).then(function(p){
        var v=p.getViewport({scale:1}); ratio=v.height/v.width;
        for(var i=1;i<=doc.numPages;i++){
          var d=document.createElement('div'); d.className='page'; d.setAttribute('data-n',i);
          d.style.height=(d.clientWidth||pages.clientWidth)*ratio+'px';
          pages.appendChild(d); pageEls.push(d);
        }
        // fix placeholder heights now that width is known
        var w=pageEls[0].clientWidth||600;
        pageEls.forEach(function(d){ d.style.height=(w*ratio)+'px'; });
        var l=document.getElementById('loading'); if(l) l.remove();
        observe();
        renderPage(1);
      });
    })
    .catch(function(){ fail('Could not load this document — please refresh.'); });

  function renderPage(n){
    if(rendered[n]||!pdfDoc) return; rendered[n]=true;
    var el=pageEls[n-1];
    pdfDoc.getPage(n).then(function(page){
      var cw=el.clientWidth||pages.clientWidth;
      var base=page.getViewport({scale:1});
      var dpr=Math.min(window.devicePixelRatio||1,2);
      var vp=page.getViewport({scale:(cw/base.width)*dpr});
      var canvas=document.createElement('canvas');
      canvas.width=vp.width; canvas.height=vp.height;
      el.style.height='auto'; el.appendChild(canvas);
      page.render({canvasContext:canvas.getContext('2d'),viewport:vp});
    });
  }
  function unrender(n){
    var el=pageEls[n-1]; var c=el&&el.querySelector('canvas');
    if(c){ el.style.height=c.getBoundingClientRect().height+'px'; c.remove(); rendered[n]=false; }
  }
  function observe(){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        var n=+e.target.getAttribute('data-n');
        if(e.isIntersecting) renderPage(n); else unrender(n);
      });
    },{root:stage,rootMargin:'1200px 0px'});
    pageEls.forEach(function(d){ io.observe(d); });
  }
  window.addEventListener('resize',function(){ /* keep simple: existing canvases scale via width:100% */ });
}

// screenshot / screen-share deterrents (best-effort — cannot be fully guaranteed in a browser)
var shield=document.getElementById('shield');
function cover(){shield.classList.add('show');}
function uncover(){shield.classList.remove('show');}
document.addEventListener('visibilitychange',function(){document.hidden?cover():uncover();});
window.addEventListener('blur',cover);
window.addEventListener('focus',uncover);
window.addEventListener('beforeprint',cover);
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase();
  if(k==='printscreen'){cover();setTimeout(uncover,1200);}
  if((e.ctrlKey||e.metaKey)&&(k==='s'||k==='p')){e.preventDefault();cover();setTimeout(uncover,1200);}
});
</script>
</body>
</html>
