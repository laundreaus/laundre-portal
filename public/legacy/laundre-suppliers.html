<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--muted:#8a9790;--ink:#2E3D36;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  .logo svg{height:24px;width:auto;display:block;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:700;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);} .btn-ghost:hover{background:#EFEADD;}
  .btn-danger{background:transparent;color:#B4472F;border:1px solid #e6cfc7;} .btn-danger:hover{background:#f7ece8;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  a.chip:hover{background:#EFEADD;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:7px;padding:9px 11px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}
  header .ttl{font-weight:700;font-size:15px;} header .spacer{flex:1;}
  main{max-width:1120px;margin:0 auto;padding:22px 22px 60px;}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar h2{font-size:19px;margin:0;color:var(--green-d);}
  .toolbar .spacer{flex:1;}
  #search{max-width:280px;}
  #cat{max-width:190px;width:auto;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(52,73,61,.08);}
  th{background:var(--green-d);color:#EAF0EC;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:11px 13px;}
  td{padding:11px 13px;border-bottom:1px solid #f0ece2;font-size:13.5px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .sname{font-weight:700;color:var(--green-d);}
  .scat{display:inline-block;background:#EBE4D5;color:#6b5a43;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
  .muted{color:#8a9790;font-size:12.5px;}
  td a{color:var(--green);}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end;}
  .rowbtns button{padding:6px 11px;font-size:12px;border-radius:6px;}
  .empty{padding:40px;text-align:center;color:#8a9790;background:#fff;border-radius:12px;}
  .ltag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap;}
  .ltag.global{background:#E1EDE4;color:#2f6b46;}
  .ltag.ho{background:#F5E3DB;color:#B4472F;}
  .ltag.loc{background:#EBE4D5;color:#6b5a43;}
  #locFilter{max-width:210px;width:auto;}
  .locpick{border:1px solid var(--cream-line);border-radius:9px;padding:10px;background:#fff;max-height:190px;overflow-y:auto;}
  .locpick .lrow{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;}
  .locpick .lrow input{width:auto;}
  .locpick .lrow label{margin:0;font-weight:500;color:var(--ink);}
  .locpick .divider{border-top:1px solid #f0ece2;margin:7px 0;}
  .locpick .hd{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#a49b86;margin:2px 0;font-weight:700;}
  .locpick.dim .loclist{opacity:.4;pointer-events:none;}
  #overlay{position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
  #overlay.show{display:flex;}
  .editor{background:var(--cream);border-radius:14px;width:600px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .ehead{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--cream-line);}
  .ehead h3{margin:0;font-size:16px;color:var(--green-d);} .ehead .spacer{flex:1;}
  .ebody{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ebody .full{grid-column:1/-1;}
  label{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:0 0 5px;}
  .efoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 20px;}
  .close{background:transparent;border:none;font-size:22px;color:#8a9790;}
  .msg{font-size:12px;color:#B4472F;padding:0 20px;min-height:15px;}
</style>

<script>
const CSRF=(window.LAUNDRE_CSRF||'');
function hdrs(json){var h={'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'};if(json)h['Content-Type']='application/json';return h;}
async function apiGet(u){const r=await fetch(u,{headers:hdrs(false),credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
let SUP=[], LOCS=[];
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function laundromats(){return LOCS;}

const searchEl=document.getElementById('search'), catEl=document.getElementById('cat'), locFilterEl=document.getElementById('locFilter');
function categories(){return [...new Set(SUP.map(s=>s.category).filter(Boolean))].sort();}
function refreshCats(){
  const cats=categories();
  catEl.innerHTML='<option value="">All categories</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');
  document.getElementById('catlist').innerHTML=cats.map(c=>'<option value="'+esc(c)+'">').join('');
}
function tokenLabel(tok){if(tok==='global')return 'All laundromats';if(tok==='head-office')return 'Head Office';const l=LOCS.find(x=>String(x.id)===String(tok));return l?l.name:tok;}
function refreshLocFilter(){
  const cur=locFilterEl.value;
  locFilterEl.innerHTML='<option value="">All locations</option><option value="global">All-laundromats (global)</option><option value="head-office">Head office</option>'
    +LOCS.map(l=>'<option value="'+l.id+'">'+esc(l.name)+'</option>').join('');
  locFilterEl.value=cur;
}
function locTags(s){
  const toks=s.locations||[];
  if(!toks.length)return '<span class="muted">\u2014</span>';
  return toks.map(t=>{const cls=t==='global'?'global':t==='head-office'?'ho':'loc';return '<span class="ltag '+cls+'">'+esc(tokenLabel(t))+'</span>';}).join('');
}
function view(){
  const q=searchEl.value.trim().toLowerCase(), cf=catEl.value, lf=locFilterEl.value;
  return SUP.filter(s=>{
    if(cf && s.category!==cf) return false;
    if(lf){
      const toks=(s.locations||[]).map(String);
      if(lf==='global'){ if(!toks.includes('global')) return false; }
      else if(lf==='head-office'){ if(!toks.includes('head-office')) return false; }
      else { if(!(toks.includes(String(lf))||toks.includes('global'))) return false; }
    }
    if(!q) return true;
    return ((s.name||'')+' '+(s.contact||'')+' '+(s.notes||'')+' '+(s.email||'')+' '+(s.category||'')+' '+(s.locations||[]).map(tokenLabel).join(' ')).toLowerCase().includes(q);
  }).sort((a,b)=>(a.category||'').localeCompare(b.category||'')||(a.name||'').localeCompare(b.name||''));
}
function render(){
  refreshCats(); refreshLocFilter();
  document.getElementById('count').textContent=SUP.length+' total';
  const rows=view();
  const wrap=document.getElementById('tableWrap');
  if(!rows.length){wrap.innerHTML='<div class="empty">No suppliers match. '+(SUP.length?'Adjust your search or filters.':'Click \u201c\uFF0B Add supplier\u201d.')+'</div>';return;}
  let h='<table><thead><tr><th>Supplier</th><th>Contact</th><th>Locations</th><th>Notes</th><th style="text-align:right">Actions</th></tr></thead><tbody>';
  rows.forEach(s=>{
    const web=s.website?'<a href="'+esc(s.website)+'" target="_blank" rel="noopener">website \u2197</a>':'';
    const mail=s.email?'<a href="mailto:'+esc(s.email)+'">'+esc(s.email)+'</a>':'';
    h+='<tr>'
      +'<td><div class="sname">'+esc(s.name)+'</div>'+(s.category?'<div style="margin-top:4px"><span class="scat">'+esc(s.category)+'</span></div>':'')+(web?'<div class="muted" style="margin-top:4px">'+web+'</div>':'')+'</td>'
      +'<td>'+(s.contact?esc(s.contact)+'<br>':'')+(s.phone?'<span class="muted">'+esc(s.phone)+'</span><br>':'')+(mail||'')+'</td>'
      +'<td>'+locTags(s)+'</td>'
      +'<td class="muted">'+esc(s.notes||'\u2014')+'</td>'
      +'<td><div class="rowbtns"><button class="btn btn-ghost" data-edit="'+s.id+'">Edit</button><button class="btn btn-danger" data-del="'+s.id+'">Delete</button></div></td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delSup(b.dataset.del));
}
async function delSup(id){
  const s=SUP.find(x=>String(x.id)===String(id));if(!confirm('Delete \u201c'+((s&&s.name)||'')+'\u201d?'))return;
  try{const r=await fetch('/suppliers-api/'+id,{method:'DELETE',headers:hdrs(false),credentials:'same-origin'});if(!r.ok&&r.status!==204)throw new Error('HTTP '+r.status);await loadAll();}catch(e){alert('Could not delete: '+e.message);}
}
searchEl.oninput=render; catEl.onchange=render; locFilterEl.onchange=render;

function renderLocPick(selected){
  const sel=new Set((selected||[]).map(String)); const isGlobal=sel.has('global');
  let h='<div class="lrow"><input type="checkbox" id="tk_global" data-tok="global"'+(isGlobal?' checked':'')+'><label for="tk_global" style="font-weight:700;color:var(--green-d)">\ud83c\udf10 All laundromats (global)</label></div>';
  h+='<div class="lrow"><input type="checkbox" id="tk_ho" data-tok="head-office"'+(sel.has('head-office')?' checked':'')+'><label for="tk_ho" style="font-weight:700">\ud83c\udfe2 Head Office</label></div>';
  h+='<div class="divider"></div><div class="hd">Laundromats</div>';
  h+= LOCS.length
    ? '<div class="loclist">'+LOCS.map(l=>'<div class="lrow"><input type="checkbox" data-tok="'+l.id+'"'+(sel.has(String(l.id))?' checked':'')+'><label>'+esc(l.name)+'</label></div>').join('')+'</div>'
    : '<div class="muted" style="font-size:12px">No laundromats yet.</div>';
  const pick=document.getElementById('locPick');
  pick.className='locpick'+(isGlobal?' dim':'');
  pick.innerHTML=h;
  document.getElementById('tk_global').onchange=e=>{pick.className='locpick'+(e.target.checked?' dim':'');};
}

let editId=null;
function openEditor(id){
  editId=id?id:null; const s=id?SUP.find(x=>String(x.id)===String(id)):null;
  document.getElementById('etitle').textContent=id?'Edit supplier':'Add supplier';
  document.getElementById('f_name').value=s?(s.name||''):'';
  document.getElementById('f_category').value=s?(s.category||''):'';
  document.getElementById('f_contact').value=s?(s.contact||''):'';
  document.getElementById('f_phone').value=s?(s.phone||''):'';
  document.getElementById('f_email').value=s?(s.email||''):'';
  document.getElementById('f_website').value=s?(s.website||''):'';
  document.getElementById('f_notes').value=s?(s.notes||''):'';
  document.getElementById('emsg').textContent='';
  refreshCats();
  renderLocPick(s?(s.locations||[]):[]);
  document.getElementById('overlay').classList.add('show');
}
function closeEditor(){document.getElementById('overlay').classList.remove('show');editId=null;}
document.getElementById('addBtn').onclick=()=>openEditor(null);
document.getElementById('eclose').onclick=closeEditor;
document.getElementById('ecancel').onclick=closeEditor;
document.getElementById('esave').onclick=async ()=>{
  const name=document.getElementById('f_name').value.trim();
  const msg=document.getElementById('emsg');
  if(!name){msg.textContent='Please enter a supplier name.';return;}
  let toks=[...document.querySelectorAll('#locPick input:checked')].map(i=>i.dataset.tok);
  if(toks.includes('global')) toks=toks.filter(t=>t==='global'||t==='head-office');
  const rec={name,
    category:document.getElementById('f_category').value.trim(),
    contact:document.getElementById('f_contact').value.trim(),
    phone:document.getElementById('f_phone').value.trim(),
    email:document.getElementById('f_email').value.trim(),
    website:document.getElementById('f_website').value.trim(),
    notes:document.getElementById('f_notes').value.trim(),
    locations:toks};
  const url=editId?('/suppliers-api/'+editId):'/suppliers-api';
  const method=editId?'PUT':'POST';
  try{
    const r=await fetch(url,{method,headers:hdrs(true),credentials:'same-origin',body:JSON.stringify(rec)});
    if(r.status===422){const j=await r.json();msg.textContent=(j.errors?Object.values(j.errors)[0][0]:(j.message||'Check the form'));return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    closeEditor();await loadAll();
  }catch(e){msg.textContent='Could not save: '+e.message;}
};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(SUP,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='laundre-suppliers.json';a.click();URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async ()=>{try{const a=JSON.parse(rd.result);if(!Array.isArray(a)){alert('Invalid file.');return;}
    let n=0;for(const rec of a){const {id,...body}=rec;const r=await fetch('/suppliers-api',{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify(body)});if(r.ok)n++;}
    await loadAll();alert('Imported '+n+' suppliers.');}catch(err){alert('Could not read file: '+err.message);}};
  rd.readAsText(f);e.target.value='';
};
async function loadAll(){
  try{
    const [locs,sup]=await Promise.all([apiGet('/locations-api'),apiGet('/suppliers-api')]);
    LOCS=Array.isArray(locs)?locs:[]; SUP=Array.isArray(sup)?sup:[];
    render();
  }catch(e){document.getElementById('tableWrap').innerHTML='<div class="empty">Could not load suppliers \u2014 '+esc(e.message)+'.</div>';}
}
loadAll();
</script>
</body>
</html>
