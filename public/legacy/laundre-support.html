<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--muted:#8a9790;--ink:#2E3D36;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  .logo svg{height:24px;width:auto;display:block;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:700;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);} .btn-ghost:hover{background:#EFEADD;}
  .btn-danger{background:transparent;color:#B4472F;border:1px solid #e6cfc7;} .btn-danger:hover{background:#f7ece8;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  a.chip:hover{background:#EFEADD;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:7px;padding:9px 11px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}
  header .ttl{font-weight:700;font-size:15px;} header .spacer{flex:1;}
  main{max-width:1000px;margin:0 auto;padding:22px 22px 60px;}
  h2{font-size:19px;margin:0 0 14px;color:var(--green-d);}
  .card{background:#fff;border:1px solid var(--cream-line);border-radius:13px;padding:18px 20px;margin-bottom:20px;}
  .card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;} .full{grid-column:1/-1;}
  label{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:0 0 5px;}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .spacer{flex:1;} .toolbar select{width:auto;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(52,73,61,.08);}
  th{background:var(--green-d);color:#EAF0EC;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:11px 13px;}
  td{padding:11px 13px;border-bottom:1px solid #f0ece2;font-size:13.5px;cursor:pointer;} tr:last-child td{border-bottom:none;}
  tr.trow:hover td{background:#faf7f0;}
  .tsub{font-weight:700;color:var(--green-d);} .tmeta{color:#8a9790;font-size:12px;}
  .tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
  .tag.incident{background:#F5E3DB;color:#B4472F;} .tag.question{background:#E6EDF3;color:#3a5a74;}
  .st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
  .st.open{background:#FBEFD6;color:#8a6414;} .st.closed{background:#E6E6E0;color:#7a7a72;}
  .empty{padding:36px;text-align:center;color:#8a9790;background:#fff;border-radius:12px;}
  /* drawer */
  #overlay{position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
  #overlay.show{display:flex;}
  .drawer{background:var(--cream);border-radius:14px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .dhead{display:flex;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--cream-line);}
  .dhead h3{margin:0;font-size:16px;color:var(--green-d);} .dhead .spacer{flex:1;}
  .dbody{padding:18px 20px;}
  .thread{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px;}
  .bub{border-radius:10px;padding:10px 13px;font-size:13px;max-width:85%;line-height:1.5;}
  .bub .who{font-size:11px;font-weight:700;margin-bottom:3px;opacity:.75;}
  .bub.them{background:#fff;border:1px solid var(--cream-line);align-self:flex-start;}
  .bub.staff{background:#E1EDE4;align-self:flex-end;}
  .close{background:transparent;border:none;font-size:22px;color:#8a9790;}
  .msg{font-size:12px;color:#B4472F;min-height:15px;margin-top:6px;}
</style>

<main>
  <h2 id="pageTitle">Support</h2>

  <div class="card" id="submitCard" style="display:none">
    <h3>Submit a request</h3>
    <div class="grid2">
      <div><label>Type</label><select id="f_type"><option>Incident</option><option>Question</option></select></div>
      <div><label>Subject</label><input id="f_subject" placeholder="Short summary" /></div>
      <div class="full"><label>Details</label><textarea id="f_body" rows="3" placeholder="Describe the incident or question for the franchise team…"></textarea></div>
    </div>
    <div class="msg" id="submitMsg"></div>
    <div style="text-align:right;margin-top:10px"><button class="btn btn-green" id="submitBtn">Submit request</button></div>
  </div>

  <div class="toolbar" id="adminTools" style="display:none">
    <strong style="color:var(--green-d)">Queue</strong>
    <span class="spacer"></span>
    <select id="fStatus"><option value="">All statuses</option><option value="Open">Open</option><option value="Closed">Closed</option></select>
    <select id="fType"><option value="">All types</option><option value="Incident">Incidents</option><option value="Question">Questions</option></select>
  </div>

  <div id="listWrap"></div>
</main>

  <div class="drawer">
    <div class="dhead"><h3 id="dTitle"></h3><span class="spacer"></span><button class="close" id="dClose">×</button></div>
    <div class="dbody" id="dBody"></div>
  </div>
</div>

<script>
const CSRF=(window.LAUNDRE_CSRF||'');
function SESSION(){try{return JSON.parse(localStorage.getItem('laundre_session')||'null')||{role:'admin'};}catch(e){return {role:'admin'};}}
const ME=SESSION(); const ADMIN=!(ME.role&&ME.role!=='admin');
let TIX=[], LOCS=[], openId=null;
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hdrs(json){var h={'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'};if(json)h['Content-Type']='application/json';return h;}
async function apiGet(u){const r=await fetch(u,{headers:hdrs(false),credentials:'same-origin'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function locName(id){const l=LOCS.find(x=>String(x.id)===String(id));return l?l.name:(id||'\u2014');}
function ms(v){var t=Date.parse(v);return isNaN(t)?0:t;}
function fmt(ts){if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});}
function normalize(t){return {id:t.id,type:t.type,subject:t.subject,body:t.body,locationId:t.location_id,userName:t.user_name,userEmail:t.user_email,status:t.status,createdAt:ms(t.created_at),responses:(t.messages||[]).map(m=>({from:m.from,role:m.role,text:m.text,at:ms(m.created_at)}))};}

async function loadAll(){
  try{
    const [locs,tix]=await Promise.all([apiGet('/locations-api'),apiGet('/tickets-api')]);
    LOCS=Array.isArray(locs)?locs:[]; TIX=(Array.isArray(tix)?tix:[]).map(normalize);
    render(); if(openId){openTicket(openId);}
  }catch(e){document.getElementById('listWrap').innerHTML='<div class="empty">Could not load requests \u2014 '+esc(e.message)+'. Try reloading.</div>';}
}

function render(){
  if(ADMIN){document.getElementById('adminTools').style.display='flex';document.getElementById('pageTitle').textContent='Support Queue';}
  else {document.getElementById('submitCard').style.display='block';document.getElementById('pageTitle').textContent='Support & Requests';}
  let rows=TIX.slice();
  if(ADMIN){
    const fs=document.getElementById('fStatus').value, ft=document.getElementById('fType').value;
    if(fs)rows=rows.filter(t=>t.status===fs);
    if(ft)rows=rows.filter(t=>t.type===ft);
  }
  rows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const wrap=document.getElementById('listWrap');
  if(!rows.length){wrap.innerHTML='<div class="empty">'+(ADMIN?'No tickets in the queue.':'You haven\u2019t submitted any requests yet.')+'</div>';return;}
  let h='<table><thead><tr><th>Request</th><th>Type</th>'+(ADMIN?'<th>Laundromat</th>':'')+'<th>Status</th><th>Updated</th></tr></thead><tbody>';
  rows.forEach(t=>{
    const last=t.responses&&t.responses.length?t.responses[t.responses.length-1].at:t.createdAt;
    h+='<tr class="trow" data-open="'+t.id+'">'
      +'<td><div class="tsub">'+esc(t.subject)+'</div><div class="tmeta">'+esc(t.userName||t.userEmail||'')+'</div></td>'
      +'<td><span class="tag '+(t.type==='Incident'?'incident':'question')+'">'+esc(t.type)+'</span></td>'
      +(ADMIN?'<td class="tmeta">'+esc(locName(t.locationId))+'</td>':'')
      +'<td><span class="st '+(t.status==='Closed'?'closed':'open')+'">'+esc(t.status)+'</span></td>'
      +'<td class="tmeta">'+fmt(last)+'</td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;
  wrap.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>openTicket(r.dataset.open));
}

function openTicket(id){
  openId=id;const t=TIX.find(x=>String(x.id)===String(id));if(!t)return;
  document.getElementById('dTitle').innerHTML=esc(t.subject)+' <span class="st '+(t.status==='Closed'?'closed':'open')+'" style="margin-left:6px">'+esc(t.status)+'</span>';
  let h='<div class="tmeta" style="margin-bottom:10px"><span class="tag '+(t.type==='Incident'?'incident':'question')+'">'+esc(t.type)+'</span> \u00b7 '+esc(locName(t.locationId))+' \u00b7 '+esc(t.userName||t.userEmail||'')+' \u00b7 '+fmt(t.createdAt)+'</div>';
  h+='<div class="thread"><div class="bub them"><div class="who">'+esc(t.userName||t.userEmail||'Franchisee')+'</div>'+esc(t.body)+'</div>';
  (t.responses||[]).forEach(r=>{h+='<div class="bub '+(r.role==='admin'?'staff':'them')+'"><div class="who">'+esc(r.from)+(r.role==='admin'?' \u00b7 Franchise team':'')+' \u00b7 '+fmt(r.at)+'</div>'+esc(r.text)+'</div>';});
  h+='</div>';
  if(t.status!=='Closed' || ADMIN){
    h+='<label>Reply</label><textarea id="replyBox" rows="2" placeholder="Type a reply\u2026"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">';
    if(ADMIN){ h+='<button class="btn btn-ghost" id="toggleStatus">'+(t.status==='Closed'?'Reopen':'Mark closed')+'</button>'; }
    h+='<button class="btn btn-green" id="sendReply">Send reply</button></div>';
  } else {
    h+='<div class="tmeta">This request is closed. Submit a new request if you need more help.</div>';
  }
  document.getElementById('dBody').innerHTML=h;
  document.getElementById('overlay').classList.add('show');
  const sr=document.getElementById('sendReply');
  if(sr) sr.onclick=async ()=>{
    const txt=document.getElementById('replyBox').value.trim();if(!txt)return;
    sr.disabled=true;
    try{const r=await fetch('/tickets-api/'+id+'/reply',{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({text:txt})});if(!r.ok)throw new Error('HTTP '+r.status);await loadAll();}
    catch(e){alert('Could not send reply: '+e.message);sr.disabled=false;}
  };
  const ts=document.getElementById('toggleStatus');
  if(ts) ts.onclick=async ()=>{
    const ns=t.status==='Closed'?'Open':'Closed';
    try{const r=await fetch('/tickets-api/'+id+'/status',{method:'PATCH',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({status:ns})});if(!r.ok)throw new Error('HTTP '+r.status);await loadAll();}
    catch(e){alert('Could not update status: '+e.message);}
  };
}
document.getElementById('dClose').onclick=()=>{document.getElementById('overlay').classList.remove('show');openId=null;};

if(ADMIN){
  document.getElementById('fStatus').onchange=render;
  document.getElementById('fType').onchange=render;
} else {
  document.getElementById('submitBtn').onclick=async ()=>{
    const subject=document.getElementById('f_subject').value.trim();
    const body=document.getElementById('f_body').value.trim();
    const msg=document.getElementById('submitMsg');
    if(!subject){msg.textContent='Please enter a subject.';return;}
    if(!body){msg.textContent='Please describe your request.';return;}
    msg.style.color='';msg.textContent='Submitting\u2026';
    try{
      const r=await fetch('/tickets-api',{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({type:document.getElementById('f_type').value,subject,body})});
      if(r.status===422){const j=await r.json();msg.style.color='#B4472F';msg.textContent=(j.message||'Please check the form');return;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      document.getElementById('f_subject').value='';document.getElementById('f_body').value='';msg.textContent='';
      await loadAll();
    }catch(e){msg.style.color='#B4472F';msg.textContent='Could not submit: '+e.message;}
  };
}
loadAll();
</script>
</body>
</html>
