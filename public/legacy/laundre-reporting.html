  input,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:7px;padding:9px 11px;width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}

  h2{font-size:20px;margin:0 0 4px;color:var(--green-d);} .sub{color:#6b7d73;font-size:13px;margin-bottom:18px;}
  .card{background:#fff;border:1px solid var(--cream-line);border-radius:14px;padding:20px 22px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
  .drop{border:2px dashed var(--cream-line);border-radius:12px;padding:26px;text-align:center;color:#8a9790;cursor:pointer;background:#fbf9f4;}
  .drop:hover{border-color:var(--green-l);background:#f7f3ea;}
  .drop b{color:var(--green-d);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
  label{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:0 0 5px;}
  .prev{background:#F3F6F3;border:1px solid #dfe7df;border-radius:10px;padding:14px 16px;margin-top:16px;font-size:13.5px;line-height:1.7;}
  .prev b{color:var(--green-d);}
  .kpi{display:inline-block;background:#E1EDE4;color:#2f6b46;border-radius:8px;padding:4px 10px;font-weight:800;margin-right:8px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;}
  th{background:var(--green-d);color:#EAF0EC;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:11px 13px;}
  td{padding:11px 13px;border-bottom:1px solid #f0ece2;font-size:13.5px;} tr:last-child td{border-bottom:none;}
  .rt{font-weight:700;color:var(--green-d);} .rev{font-weight:800;color:var(--green);}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end;} .rowbtns button{padding:6px 11px;font-size:12px;border-radius:6px;}
  .empty{padding:30px;text-align:center;color:#8a9790;}
  .msg{font-size:13px;min-height:16px;margin-top:10px;} .msg.err{color:#B4472F;} .msg.ok{color:#2f6b46;}
</style>

function loadSales(){try{const r=localStorage.getItem(KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a))return a;}}catch(e){}const s=SALES_SEED.slice();save(s);return s;}
function save(a){SALES=a||SALES;try{localStorage.setItem(KEY,JSON.stringify(SALES));}catch(e){alert('Storage full.');}}
let SALES=[];
function esc(s){return (''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function AUD(n){return '$'+(Math.round((n||0)*100)/100).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function laundromats(){try{const r=localStorage.getItem('laundre_sites_v1');if(r){const a=JSON.parse(r);if(Array.isArray(a))return a.map(s=>({id:s.id,name:s.name}));}}catch(e){}return [];}
function locName(id){const l=laundromats().find(x=>x.id===id);return l?l.name:null;}
function monthLabel(ym){const[y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'});}

/* ---- CSV parser (quoted fields) ---- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let i=0,f='',row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}

/* ---- Parse a transactions CSV into daily aggregates ---- */
let staged=null;
function guessSite(fn){const f=fn.toLowerCase();if(f.includes('southport'))return 'sthport';if(f.includes('coomera'))return 'coomera';if(f.includes('tweed'))return 'tweed';return '';}
function processFile(file){
  const msg=document.getElementById('msg'); msg.className='msg';
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCSV(rd.result);
      if(rows.length<2){msg.className='msg err';msg.textContent='That file has no data rows.';return;}
      const head=rows[0].map(h=>h.trim().toLowerCase());
      const di=head.indexOf('date'), ai=head.indexOf('amount'), si=head.indexOf('status');
      if(di<0||ai<0){msg.className='msg err';msg.textContent='Could not find “date” and “amount” columns in this CSV.';return;}
      const daily={}; let approved=0, total=0;
      for(let r=1;r<rows.length;r++){
        const row=rows[r]; if(!row||row.length<=di) continue;
        const st=(si>=0?(row[si]||''):'Approved').trim().toLowerCase();
        if(st!=='approved') continue;
        const d=(row[di]||'').trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
        const amt=parseFloat(row[ai]||'0')||0;
        daily[d]=daily[d]||{rev:0,txns:0}; daily[d].rev+=amt; daily[d].txns++; approved++; total+=amt;
      }
      const dates=Object.keys(daily).sort();
      if(!dates.length){msg.className='msg err';msg.textContent='No approved transactions found in this file.';return;}
      const months=[...new Set(dates.map(d=>d.slice(0,7)))];
      staged={fileName:file.name,daily,dates,months,approved,total:Math.round(total*100)/100,guess:guessSite(file.name)};
      renderPreview();
      msg.textContent='';
    }catch(err){msg.className='msg err';msg.textContent='Could not read file: '+err.message;}
  };
  rd.readAsText(file);
}
function renderPreview(){
  const s=staged; const locs=laundromats();
  const opts=locs.map(l=>'<option value="'+l.id+'"'+(l.id===s.guess?' selected':'')+'>'+esc(l.name)+'</option>').join('');
  document.getElementById('preview').innerHTML=
    '<div class="prev"><div><b>'+esc(s.fileName)+'</b></div>'
    +'<div style="margin-top:8px"><span class="kpi">'+AUD(s.total)+'</span><span class="kpi">'+s.approved+' txns</span><span class="kpi">'+s.dates.length+' days</span></div>'
    +'<div style="margin-top:8px">Period: <b>'+s.months.map(monthLabel).join(', ')+'</b></div>'
    +'<div class="grid2"><div><label>This report is for laundromat</label><select id="siteSel">'+(opts||'<option value="">— no locations —</option>')+'</select></div>'
    +'<div style="display:flex;align-items:flex-end"><button class="btn btn-green" id="importBtn" style="width:100%">Import into dashboard</button></div></div>'
    +'<div style="font-size:11.5px;color:#8a9790;margin-top:8px">Importing replaces any existing data for this laundromat in '+s.months.map(monthLabel).join(', ')+'.</div></div>';
  document.getElementById('importBtn').onclick=doImport;
}
function doImport(){
  const s=staged; const locId=document.getElementById('siteSel').value;
  const msg=document.getElementById('msg');
  if(!locId){msg.className='msg err';msg.textContent='Select which laundromat this report is for.';return;}
  const site=locName(locId)||s.guess||locId;
  // remove existing records for this loc + these months
  SALES=SALES.filter(rec=>!(rec.locationId===locId && s.months.includes((rec.date||'').slice(0,7))));
  s.dates.forEach(d=>{SALES.push({locationId:locId,site,date:d,revenue:Math.round(s.daily[d].rev*100)/100,txns:s.daily[d].txns});});
  save();
  staged=null; document.getElementById('preview').innerHTML=''; document.getElementById('fileInput').value='';
  msg.className='msg ok'; msg.textContent='Imported '+AUD(s.total)+' across '+s.dates.length+' days. The dashboard is updated.';
  renderReports();
}

/* ---- Reports list (grouped by site + month) ---- */
function renderReports(){
  const groups={};
  SALES.forEach(r=>{const ym=(r.date||'').slice(0,7);const key=r.locationId+'|'+ym;groups[key]=groups[key]||{locationId:r.locationId,site:r.site,ym,revenue:0,txns:0,days:new Set()};groups[key].revenue+=r.revenue;groups[key].txns+=r.txns;groups[key].days.add(r.date);});
  const rows=Object.values(groups).sort((a,b)=>b.ym.localeCompare(a.ym)||(a.site||'').localeCompare(b.site||''));
  const wrap=document.getElementById('reportsWrap');
  if(!rows.length){wrap.innerHTML='<div class="empty">No reports yet. Upload a CSV above.</div>';return;}
  let h='<table><thead><tr><th>Laundromat</th><th>Month</th><th>Revenue</th><th>Txns</th><th>Days</th><th style="text-align:right">Actions</th></tr></thead><tbody>';
  rows.forEach(g=>{h+='<tr><td class="rt">'+esc(locName(g.locationId)||g.site||g.locationId)+'</td><td>'+monthLabel(g.ym)+'</td><td class="rev">'+AUD(g.revenue)+'</td><td>'+g.txns+'</td><td>'+g.days.size+'</td>'
    +'<td><div class="rowbtns"><button class="btn btn-danger" data-del="'+g.locationId+'|'+g.ym+'">Delete</button></div></td></tr>';});
  h+='</tbody></table>';
  wrap.innerHTML=h;
  wrap.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const [loc,ym]=b.dataset.del.split('|');
    if(confirm('Delete this report? It will be removed from the dashboard.')){SALES=SALES.filter(r=>!(r.locationId===loc && (r.date||'').slice(0,7)===ym));save();renderReports();}
  });
}

/* ---- wire ---- */
const drop=document.getElementById('drop'), fi=document.getElementById('fileInput');
drop.onclick=()=>fi.click();
fi.onchange=e=>{if(e.target.files[0])processFile(e.target.files[0]);};
drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='#435E53';});
drop.addEventListener('dragleave',()=>drop.style.borderColor='');
drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='';if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);});
SALES=loadSales(); renderReports();
</script>
