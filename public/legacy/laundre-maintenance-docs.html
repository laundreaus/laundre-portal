<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laundré · Maintenance Docs</title>
<script>(function(){var a=localStorage.getItem('laundre_auth')==='1',s=null;try{s=JSON.parse(localStorage.getItem('laundre_session')||'null');}catch(e){}var r=s&&s.role;if(!a||(r&&r!=='admin'&&r!=='maintenance'))location.replace('laundre-portal.html');})();</script>
<style>
  :root{--cream:#F4EFE6;--cream-line:#E4DBCB;--field:#FFFFFF;--green:#435E53;--green-d:#33473D;--accent:#C4703F;--muted:#8a9790;--ink:#2E3D36;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);}
  .wm{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:21px;color:var(--green);letter-spacing:.3px;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:700;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;color:var(--green);border:1px solid var(--cream-line);} .btn-ghost:hover{background:#EFEADD;}
  .btn-danger{background:transparent;color:#B4472F;border:1px solid #e6cfc7;} .btn-danger:hover{background:#f7ece8;}
  a.chip{font-size:12.5px;font-weight:700;color:var(--green);text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;}
  a.chip:hover{background:#EFEADD;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--cream-line);border-radius:7px;padding:9px 11px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  header{background:var(--cream);border-bottom:1px solid var(--cream-line);display:flex;align-items:center;gap:12px;padding:12px 22px;position:sticky;top:0;z-index:20;}
  header .ttl{font-weight:700;font-size:15px;} header .spacer{flex:1;}
  main{max-width:1000px;margin:0 auto;padding:22px 22px 60px;}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar h2{font-size:19px;margin:0;color:var(--green-d);} .toolbar .spacer{flex:1;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(52,73,61,.08);}
  th{background:var(--green-d);color:#EAF0EC;font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:11px 13px;}
  td{padding:11px 13px;border-bottom:1px solid #f0ece2;font-size:13.5px;vertical-align:middle;} tr:last-child td{border-bottom:none;}
  .dtitle{font-weight:700;color:var(--green-d);} .dcat{color:#8a9790;font-size:12px;}
  .cat{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;background:#E1EDE4;color:#2f6b46;}
  .dl{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--cream-line);border-radius:7px;padding:6px 11px;font-size:12.5px;text-decoration:none;color:var(--green);font-weight:700;}
  .dl:hover{background:#EFEADD;}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end;} .rowbtns button{padding:6px 11px;font-size:12px;border-radius:6px;}
  .empty{padding:40px;text-align:center;color:#8a9790;background:#fff;border-radius:12px;}
  #overlay{position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
  #overlay.show{display:flex;}
  .editor{background:var(--cream);border-radius:14px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .ehead{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--cream-line);}
  .ehead h3{margin:0;font-size:16px;color:var(--green-d);} .ehead .spacer{flex:1;}
  .ebody{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ebody .full{grid-column:1/-1;}
  label{font-size:12px;color:#5f7469;font-weight:600;display:block;margin:0 0 5px;}
  .efoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 20px;}
  .close{background:transparent;border:none;font-size:22px;color:#8a9790;}
  .msg{font-size:12px;color:#B4472F;padding:0 20px;min-height:15px;}
  .hint{font-size:11.5px;color:#8a9790;margin-top:18px;line-height:1.6;}
</style>
</head>
<body>
<header>
  <span class="wm">Laundré</span>
  <span class="ttl">· Maintenance Docs</span>
  <span class="spacer"></span>
  <a class="chip" href="laundre-portal.html">⌂ Portal</a>
  <button class="btn btn-green" id="addBtn" style="display:none">+ Upload doc</button>
</header>
<main>
  <div class="toolbar">
    <h2 id="head">Maintenance Documents</h2>
    <span class="spacer"></span>
    <input id="q" placeholder="Search…" style="max-width:220px" oninput="render()">
  </div>
  <div id="list"></div>
  <p class="hint" id="hint"></p>
</main>

<div id="overlay">
  <div class="editor">
    <div class="ehead"><h3 id="etitle">Upload document</h3><span class="spacer"></span><button class="close" onclick="closeEd()">×</button></div>
    <div class="ebody">
      <div class="full"><label>Title</label><input id="f_title" placeholder="e.g. Fuego FLW-10 service manual"></div>
      <div><label>Category</label>
        <select id="f_cat"><option>Machine manual</option><option>Service guide</option><option>Wiring / electrical</option><option>Plumbing</option><option>Safety</option><option>Warranty</option><option>Other</option></select></div>
      <div><label>Machine / area (optional)</label><input id="f_machine" placeholder="e.g. Washer, Dryer, HWS"></div>
      <div class="full"><label>Notes (optional)</label><textarea id="f_note" rows="2" placeholder="Any notes for the team…"></textarea></div>
      <div class="full"><label>File (PDF, image, etc.)</label><input id="f_file" type="file"></div>
    </div>
    <div class="msg" id="emsg"></div>
    <div class="efoot"><button class="btn btn-ghost" onclick="closeEd()">Cancel</button><button class="btn btn-green" onclick="save()">Save document</button></div>
  </div>
</div>

<script>
var KEY='laundre_maintdocs_v1';
var sess=null; try{sess=JSON.parse(localStorage.getItem('laundre_session')||'null');}catch(e){}
var isAdmin=!(sess&&sess.role&&sess.role!=='admin');
function load(){try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveAll(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){alert('Could not save — the file may be too large for browser storage. Try a smaller file.');}}
function esc(s){return (''+(s==null?'':s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(d){try{return new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}
function bytes(n){if(!n)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(0)+' KB';return (n/1048576).toFixed(1)+' MB';}

function render(){
  document.getElementById('addBtn').style.display=isAdmin?'':'none';
  document.getElementById('head').textContent=isAdmin?'Maintenance Documents':'Maintenance Documents — for your team';
  document.getElementById('hint').textContent=isAdmin
    ? 'Uploaded files are stored in this browser for the prototype. Keep individual files small (a few MB). Move to server storage for production.'
    : 'Documents your admin has shared with the maintenance team. Tap Download to open.';
  var q=(document.getElementById('q').value||'').toLowerCase();
  var rows=load().filter(function(d){return !q||((d.title||'')+' '+(d.category||'')+' '+(d.machine||'')).toLowerCase().indexOf(q)>=0;});
  rows.sort(function(a,b){return (b.at||0)-(a.at||0);});
  var host=document.getElementById('list');
  if(!rows.length){host.innerHTML='<div class="empty">'+(isAdmin?'No documents yet. Click “+ Upload doc”.':'No documents shared yet.')+'</div>';return;}
  var h='<table><thead><tr><th>Document</th><th>Category</th><th>Machine / area</th><th>Added</th><th></th></tr></thead><tbody>';
  rows.forEach(function(d){
    h+='<tr><td><div class="dtitle">'+esc(d.title)+'</div>'+(d.note?'<div class="dcat">'+esc(d.note)+'</div>':'')+(d.fileName?'<div class="dcat">'+esc(d.fileName)+' · '+bytes(d.fileSize)+'</div>':'')+'</td>'
      +'<td><span class="cat">'+esc(d.category||'Other')+'</span></td>'
      +'<td>'+esc(d.machine||'—')+'</td>'
      +'<td>'+fmt(d.at)+'</td>'
      +'<td><div class="rowbtns">'
      +(d.fileData?'<a class="dl" href="'+d.fileData+'" download="'+esc(d.fileName||'document')+'">Download</a>':'')
      +(isAdmin?'<button class="btn btn-danger" onclick="del(\''+d.id+'\')">Delete</button>':'')
      +'</div></td></tr>';
  });
  h+='</tbody></table>';
  host.innerHTML=h;
}
function openEd(){document.getElementById('f_title').value='';document.getElementById('f_cat').value='Machine manual';document.getElementById('f_machine').value='';document.getElementById('f_note').value='';document.getElementById('f_file').value='';document.getElementById('emsg').textContent='';document.getElementById('overlay').classList.add('show');}
function closeEd(){document.getElementById('overlay').classList.remove('show');}
function save(){
  var title=document.getElementById('f_title').value.trim();
  if(!title){document.getElementById('emsg').textContent='Please enter a title.';return;}
  var rec={id:'d'+Date.now()+Math.random().toString(36).slice(2,6),title:title,category:document.getElementById('f_cat').value,machine:document.getElementById('f_machine').value.trim(),note:document.getElementById('f_note').value.trim(),at:Date.now(),fileName:'',fileSize:0,fileData:''};
  var f=document.getElementById('f_file').files[0];
  function commit(){var a=load();a.push(rec);saveAll(a);closeEd();render();}
  if(f){
    if(f.size>8*1048576){document.getElementById('emsg').textContent='File is larger than 8 MB — please use a smaller file for the prototype.';return;}
    rec.fileName=f.name;rec.fileSize=f.size;
    var rd=new FileReader();rd.onload=function(){rec.fileData=rd.result;commit();};rd.onerror=function(){document.getElementById('emsg').textContent='Could not read the file.';};rd.readAsDataURL(f);
  } else { commit(); }
}
function del(id){if(!confirm('Delete this document?'))return;saveAll(load().filter(function(d){return d.id!==id;}));render();}
document.getElementById('addBtn').onclick=openEd;
render();
</script>
</body>
</html>
