<title>Region &amp; Postcode Radius Tool</title>

<script>(function(){var a=localStorage.getItem('laundre_auth')==='1',s=null;try{s=JSON.parse(localStorage.getItem('laundre_session')||'null');}catch(e){}if(!a||(s&&s.role&&s.role!=='admin'))location.replace('laundre-portal.html');})();</script>
<style>
  :root{
    --cream:#F4EFE6; --cream-line:#E4DBCB; --field:#FFFFFF;
    --green:#435E53; --green-d:#33473D; --green-l:#6E8B7B;
    --accent:#E4A66F;   /* warm sand — headings on green */
    --terra:#C4703F;    /* terracotta — chips & map dots */
    --text:#F4EFE6; --muted:#AEC0B5; --ink:#2E3D36;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
  #wrap{display:flex;flex-direction:column;height:100vh;width:100vw;}
  /* Top bar */
  #bar{background:var(--cream);color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--cream-line);box-shadow:0 2px 8px rgba(52,73,61,.10);z-index:1000;}
  #bar .logo{display:flex;align-items:center;margin-right:4px;}
  #bar .logo svg{height:26px;width:auto;display:block;}
  .divider{width:1px;height:26px;background:var(--cream-line);margin:0 4px;}
  .acwrap{position:relative;flex:1;min-width:240px;}
  #bar input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--cream-line);border-radius:7px;font-size:14px;color:var(--ink);background:var(--field);}
  #bar input[type=text]:focus,#bar input[type=number]:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(67,94,83,.18);}
  #suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--cream-line);border-radius:8px;box-shadow:0 6px 20px rgba(52,73,61,.22);overflow:hidden;z-index:2000;display:none;}
  #suggest.show{display:block;}
  #suggest .s{padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;border-bottom:1px solid #f0ece2;line-height:1.35;}
  #suggest .s:last-child{border-bottom:none;}
  #suggest .s:hover,#suggest .s.active{background:#EFEADD;}
  #suggest .s small{color:#8a9790;}
  #bar input[type=number]{width:80px;padding:9px 10px;border:1px solid var(--cream-line);border-radius:7px;font-size:14px;color:var(--ink);background:var(--field);}
  .toggle{display:inline-flex;background:#E7DECE;border-radius:7px;overflow:hidden;border:1px solid var(--cream-line);}
  .toggle button{background:transparent;color:#6b8073;border:none;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .toggle button.on{background:var(--green);color:#fff;}
  #go{background:var(--green);color:#fff;border:none;padding:9px 22px;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
  #go:hover{filter:brightness(1.1);}
  #go:disabled{opacity:.5;cursor:wait;}
  .lbl{font-size:12px;color:#5f7469;white-space:nowrap;}
  /* Body */
  #body{flex:1;display:flex;min-height:0;}
  #map{flex:1;height:100%;background:#e9efe9;}
  #panel{width:360px;max-width:44%;background:var(--green-d);color:var(--text);overflow-y:auto;padding:18px 20px;}
  #panel h1{font-size:17px;margin:0 0 3px;color:#fff;}
  #panel .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .block{margin-bottom:18px;}
  .block h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 8px;border-bottom:1px solid rgba(244,239,230,.16);padding-bottom:5px;}
  .kv{font-size:13px;line-height:1.5;margin-bottom:4px;color:#DDE7E0;}
  .kv b{color:#fff;}
  .pc{display:inline-block;background:var(--terra);color:#fff;border-radius:5px;padding:3px 10px;margin:0 6px 6px 0;font-size:12.5px;font-weight:700;}
  .subgrp{margin-bottom:10px;}
  .subgrp .h{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:3px;}
  ul.subs{list-style:none;margin:0;padding:0;columns:2;column-gap:14px;font-size:12px;}
  ul.subs li{padding:2px 0;color:#CDDAD1;line-height:1.35;cursor:pointer;}
  ul.subs li:hover{color:var(--accent);}
  .legend{font-size:12px;line-height:1.7;}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle;}
  .foot{font-size:10.5px;color:#8fa79a;margin-top:8px;line-height:1.5;}
  .msg{font-size:13px;color:var(--muted);padding:8px 0;}
  .err{color:#F0B49A;}
  .placeholder{color:var(--muted);font-size:13px;line-height:1.6;}
  .sites-tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#435E53;font-weight:600;white-space:nowrap;cursor:pointer;}
  .sites-tog input{accent-color:#435E53;width:15px;height:15px;}
  .adminlink{font-size:12.5px;font-weight:700;color:#435E53;text-decoration:none;border:1px solid var(--cream-line);border-radius:7px;padding:8px 12px;white-space:nowrap;}
  .adminlink:hover{background:#EFEADD;}
  /* Laundré logo map pin */
  .lpin{background:#fff;border:1.5px solid #435E53;border-radius:8px;padding:4px 8px;box-shadow:0 2px 7px rgba(30,42,36,.28);white-space:nowrap;position:relative;}
  .lpin svg{height:13px;width:auto;display:block;}
  .lpin::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #435E53;}
  .siterow{padding:9px 11px;border:1px solid rgba(244,239,230,.16);border-radius:8px;margin-bottom:8px;cursor:pointer;}
  .siterow:hover{background:rgba(244,239,230,.08);border-color:var(--accent);}
  .siterow b{display:block;color:#fff;font-size:13.5px;}
  .siterow span{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
  .statusbadge{display:inline-block;background:#2f6b46;color:#dff0e6;border-radius:20px;padding:1px 9px;font-size:10.5px;font-weight:700;}
  .lpin-dot{display:inline-block;width:13px;height:10px;border-radius:2px;background:#fff;border:1.5px solid #435E53;margin-right:6px;vertical-align:middle;}
  @media(max-width:760px){#body{flex-direction:column;}#panel{width:100%;max-width:100%;height:46%;}#map{height:54%;}}
</style>
</head>

<script>
let PC = [];
// Postcode dataset is large (~1MB); load it as JSON to stay under the server response limit.
fetch('/postcode-data',{credentials:'same-origin',headers:{'Accept':'application/json'}})
  .then(function(r){return r.ok?r.json():[];})
  .then(function(a){if(Array.isArray(a))PC=a;})
  .catch(function(){});

// ---- Helpers ----
function distM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function nomURL(q,limit){return 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=au&addressdetails=1&limit='
  +limit+'&email='+encodeURIComponent(CONTACT_EMAIL)+'&q='+encodeURIComponent(q);}

async function geocode(q){
  const r=await fetch(nomURL(q,1),{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('Geocoding service error ('+r.status+')');
  const j=await r.json();
  if(!j.length) throw new Error('Address not found. Try adding suburb, state or postcode.');
  return j[0];
}

const sitesLayer=L.layerGroup().addTo(map);
let SITES=[];

function laundrePin(){
  return L.divIcon({className:'',iconSize:[104,26],iconAnchor:[52,34],popupAnchor:[0,-36],
    html:'<div class="lpin">'+LOGO_SVG+'</div>'});
}
function computeInR(center,radiusM){
  return PC.map(r=>({pc:r[0],loc:r[1],st:r[2],lat:r[3],lng:r[4],lga:r[5],d:distM(center,[r[3],r[4]])}))
           .filter(r=>r.d<=radiusM).sort((x,y)=>x.d-y.d);
}
function subBlocksHTML(inR){
  const postcodes=[...new Set(inR.map(r=>r.pc))].sort();
  let html='<div class="block"><h2>Postcodes in radius</h2>';
  html+= postcodes.length ? postcodes.map(p=>'<span class="pc">'+p+'</span>').join('')
                          : '<div class="msg">No mapped suburbs fall inside this radius. Try a larger radius.</div>';
  html+='</div>';
  if(inR.length){
    html+='<div class="block"><h2>Suburbs by postcode</h2>';
    postcodes.forEach(p=>{
      const uniq=[...new Set(inR.filter(r=>r.pc===p).map(r=>r.loc.replace(/\b\w/g,c=>c.toUpperCase())))].sort();
      html+='<div class="subgrp"><div class="h">'+p+' ('+uniq.length+')</div><ul class="subs">'+uniq.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>';
    });
    html+='</div>';
  }
  return {html,postcodes};
}
function legendHTML(){
  return '<div class="block"><h2>Legend</h2><div class="legend">'
    +'<div><span class="lpin-dot"></span> Laundré location (green radius)</div>'
    +'<div><span class="dot" style="background:#C4703F"></span> Suburb centre inside radius</div>'
    +'<div><span class="dot" style="background:rgba(67,94,83,.25);border:2px solid #435E53"></span> Radius</div>'
    +'<div><span class="dot" style="background:#435E53"></span> Ad-hoc search point</div></div>'
    +'<div class="foot">Suburbs are matched by their centre point, so very large postcodes touching only the edge of the circle may not appear. '
    +'Geocoding &amp; postcode data: OpenStreetMap / Nominatim &amp; matthewproctor/australianpostcodes.</div></div>';
}
function renderSites(){
  sitesLayer.clearLayers();
  SITES.filter(s=>s.status==='active').forEach(s=>{
    const rM=s.unit==='km'?s.radius*1000:s.radius;
    L.circle([s.lat,s.lng],{radius:rM,color:'#435E53',weight:3,fillColor:'#435E53',fillOpacity:0.10}).addTo(sitesLayer);
    const m=L.marker([s.lat,s.lng],{icon:laundrePin()}).addTo(sitesLayer);
    m.on('click',()=>showSiteInfo(s));
    m.bindTooltip(s.name,{direction:'top',offset:[0,-34]});
  });
}
function fitSites(){
  const active=SITES.filter(s=>s.status==='active');
  if(!active.length){map.setView([-25.29,152.85],5);return;}
  map.fitBounds(L.latLngBounds(active.map(s=>[s.lat,s.lng])),{padding:[70,70],maxZoom:12});
}
function showSiteInfo(s){
  const center=[+s.lat,+s.lng];
  const rM=s.unit==='km'?s.radius*1000:s.radius;
  const inR=computeInR(center,rM);
  const lgaSet=new Set(); inR.forEach(r=>{if(r.lga)lgaSet.add(r.lga);});
  const km=rM>=1000?(rM/1000)+' km':rM+' m';
  const {html:blocks,postcodes}=subBlocksHTML(inR);
  let html='<h1>'+esc(s.name)+'</h1>';
  html+='<div class="sub"><span class="statusbadge">● Active</span> · '+km+' radius · '+inR.length+' suburbs · '+postcodes.length+' postcode'+(postcodes.length!==1?'s':'')+'</div>';
  html+='<div class="block"><h2>Laundré location</h2>';
  html+='<div class="kv"><b>Address:</b> '+esc(s.address||'—')+'</div>';
  html+='<div class="kv"><b>Coordinates:</b> '+center[0].toFixed(5)+', '+center[1].toFixed(5)+'</div>';
  html+='<div class="kv"><b>Radius:</b> '+km+'</div>';
  if(s.notes) html+='<div class="kv"><b>Notes:</b> '+esc(s.notes)+'</div>';
  html+='</div>';
  html+='<div class="block"><h2>Local Government Area'+(lgaSet.size>1?'s':'')+'</h2>';
  html+= lgaSet.size ? [...lgaSet].map(l=>'<div class="kv"><b>'+esc(l)+'</b></div>').join('') : '<div class="kv">Not recorded.</div>';
  html+='</div>'+blocks+legendHTML();
  content.innerHTML=html;
  // Show suburb dots for this site (in the search layer) and zoom in
  layer.clearLayers();
  inR.forEach(r=>L.circleMarker([r.lat,r.lng],{radius:6,color:'#fff',weight:1.4,fillColor:'#C4703F',fillOpacity:.95})
    .addTo(layer).bindPopup('<b>'+esc(r.loc)+'</b><br>Postcode '+r.pc));
  map.fitBounds(L.latLng(center).toBounds(rM*2),{padding:[25,25]});
  map.setZoom(map.getZoom()+0.5,{animate:false});
}
function renderSiteList(){
  const active=SITES.filter(s=>s.status==='active');
  let html='<h1>Laundré locations</h1>';
  html+='<div class="sub">'+active.length+' active site'+(active.length!==1?'s':'')+' · click a site pin, or search any address</div>';
  html+='<div class="block"><h2>Approved sites</h2>';
  if(active.length) active.forEach(s=>{html+='<div class="siterow" data-id="'+s.id+'"><b>'+esc(s.name)+'</b><span>'+esc(s.address)+' · '+s.radius+' '+s.unit+' radius</span></div>';});
  else html+='<div class="msg">No active locations yet. Add them in the Admin portal.</div>';
  html+='</div>'+legendHTML();
  content.innerHTML=html;
  content.querySelectorAll('.siterow').forEach(el=>el.onclick=()=>{const s=SITES.find(x=>x.id===el.dataset.id);if(s)showSiteInfo(s);});
}

function render(hit){
  current=hit;
  const val=parseFloat(radEl.value);
  if(!(val>0)){content.innerHTML='<div class="msg err">Enter a radius greater than 0.</div>';return;}
  const radiusM = unit==='km' ? val*1000 : val;
  const lat=parseFloat(hit.lat), lng=parseFloat(hit.lon), center=[lat,lng];
  const a=hit.address||{};
  const lga = a.municipality||a.city||a.county||a.local_government_area||a.region||a.state_district||'';

  const inR = PC.map(r=>({pc:r[0],loc:r[1],st:r[2],lat:r[3],lng:r[4],lga:r[5],d:distM(center,[r[3],r[4]])}))
                .filter(r=>r.d<=radiusM).sort((x,y)=>x.d-y.d);
  const postcodes=[...new Set(inR.map(r=>r.pc))].sort();
  const lgaSet=new Set(); if(lga) lgaSet.add(lga);
  inR.forEach(r=>{if(r.lga) lgaSet.add(r.lga);});

  layer.clearLayers();
  const circ=L.circle(center,{radius:radiusM,color:'#435E53',weight:3,dashArray:'5 6',fillColor:'#435E53',fillOpacity:0.08}).addTo(layer);
  inR.forEach(r=>{
    L.circleMarker([r.lat,r.lng],{radius:6,color:'#fff',weight:1.4,fillColor:'#C4703F',fillOpacity:.95})
      .addTo(layer).bindPopup('<b>'+esc(r.loc)+'</b><br>Postcode '+r.pc+(r.lga?'<br>'+esc(r.lga):''));
  });
  const pinIcon=L.divIcon({className:'',iconSize:[28,36],iconAnchor:[14,36],popupAnchor:[0,-32],
    html:'<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.3 0 0 6.3 0 14c0 9.9 14 22 14 22s14-12.1 14-22C28 6.3 21.7 0 14 0z" fill="#435E53"/><circle cx="14" cy="14" r="5.4" fill="#F4EFE6"/></svg>'});
  const pin=L.marker(center,{icon:pinIcon}).addTo(layer);
  pin.bindPopup('<b>'+esc(hit.display_name.split(',').slice(0,2).join(','))+'</b><br>'+
    (radiusM>=1000?(radiusM/1000)+' km':radiusM+' m')+' radius').openPopup();
  // Fit to the on-map circle, then zoom in ~75% tighter than the fit view
  map.fitBounds(circ.getBounds(),{padding:[20,20]});
  map.setZoom(map.getZoom()+0.75,{animate:false});

  const km = radiusM>=1000 ? (radiusM/1000)+' km' : radiusM+' m';
  let html='';
  html+='<h1>'+esc(hit.display_name.split(',').slice(0,3).join(', '))+'</h1>';
  html+='<div class="sub">'+km+' radius · '+inR.length+' suburbs · '+postcodes.length+' postcode'+(postcodes.length!==1?'s':'')+'</div>';
  html+='<div class="block"><h2>Search point</h2>';
  html+='<div class="kv"><b>Address:</b> '+esc(hit.display_name)+'</div>';
  html+='<div class="kv"><b>Coordinates:</b> '+lat.toFixed(5)+', '+lng.toFixed(5)+'</div>';
  html+='<div class="kv"><b>Radius:</b> '+km+'</div></div>';
  html+='<div class="block"><h2>Local Government Area'+(lgaSet.size>1?'s':'')+'</h2>';
  html+= lgaSet.size ? [...lgaSet].map(l=>'<div class="kv"><b>'+esc(l)+'</b></div>').join('')
                     : '<div class="kv">Not returned for this location.</div>';
  html+='</div>';
  html+=subBlocksHTML(inR).html;
  html+=legendHTML();
  content.innerHTML=html;
}

// ---- Search button / typed address ----
function run(){
  hideSug();
  const q=addrEl.value.trim();
  if(!q){content.innerHTML='<div class="msg err">Please enter an address.</div>';return;}
  goBtn.disabled=true;
  content.innerHTML='<div class="msg">Searching…</div>';
  geocode(q).then(hit=>render(hit))
    .catch(e=>{content.innerHTML='<div class="msg err">'+esc(e.message||'Something went wrong.')+'</div>';})
    .finally(()=>{goBtn.disabled=false;});
}
goBtn.onclick=run;

// ---- Predictive autocomplete ----
let sugTimer=null, sugItems=[], sugActive=-1, sugSeq=0;
function hideSug(){sugEl.classList.remove('show');sugEl.innerHTML='';sugItems=[];sugActive=-1;}
function drawSug(){
  if(!sugItems.length){hideSug();return;}
  sugEl.innerHTML=sugItems.map((h,i)=>{
    const parts=h.display_name.split(',');
    const head=esc(parts.slice(0,2).join(',').trim());
    const tail=esc(parts.slice(2).join(',').trim());
    return '<div class="s'+(i===sugActive?' active':'')+'" data-i="'+i+'">'+head+
      (tail?' <small>'+tail+'</small>':'')+'</div>';
  }).join('');
  sugEl.classList.add('show');
  sugEl.querySelectorAll('.s').forEach(el=>{
    el.onclick=()=>pick(parseInt(el.dataset.i));
  });
}
function pick(i){
  const h=sugItems[i]; if(!h) return;
  addrEl.value=h.display_name.split(',').slice(0,3).join(', ');
  hideSug();
  render(h);   // auto-centre + draw immediately, no extra request
}
function fetchSug(q){
  const seq=++sugSeq;
  fetch(nomURL(q,6),{headers:{'Accept':'application/json'}})
    .then(r=>r.json())
    .then(j=>{ if(seq!==sugSeq) return; sugItems=j||[]; sugActive=-1; drawSug(); })
    .catch(()=>{});
}
addrEl.addEventListener('input',()=>{
  const q=addrEl.value.trim();
  clearTimeout(sugTimer);
  if(q.length<3){hideSug();return;}
  sugTimer=setTimeout(()=>fetchSug(q),300);   // debounce (respects Nominatim rate limits)
});
addrEl.addEventListener('keydown',e=>{
  if(sugEl.classList.contains('show') && sugItems.length){
    if(e.key==='ArrowDown'){e.preventDefault();sugActive=(sugActive+1)%sugItems.length;drawSug();return;}
    if(e.key==='ArrowUp'){e.preventDefault();sugActive=(sugActive-1+sugItems.length)%sugItems.length;drawSug();return;}
    if(e.key==='Enter'){e.preventDefault();pick(sugActive>=0?sugActive:0);return;}
    if(e.key==='Escape'){hideSug();return;}
  } else if(e.key==='Enter'){ run(); }
});
document.addEventListener('click',e=>{ if(!sugEl.contains(e.target)&&e.target!==addrEl) hideSug(); });

// ---- Radius change → auto redraw (no re-geocode) ----
let radTimer=null;
radEl.addEventListener('input',()=>{
  if(!current) return;
  clearTimeout(radTimer);
  radTimer=setTimeout(()=>render(current),250);
});
radEl.addEventListener('keydown',e=>{if(e.key==='Enter'){ if(current) render(current); else run(); }});

// ---- Show/hide Laundré sites ----
document.getElementById('showSites').addEventListener('change',e=>{
  if(e.target.checked) sitesLayer.addTo(map); else map.removeLayer(sitesLayer);
});

// ---- Init: load approved sites from the live database (fallback to local) ----
async function initSites(){
  try{
    var CSRF=(window.LAUNDRE_CSRF||'');
    var r=await fetch('/locations-api',{headers:{'Accept':'application/json','X-CSRF-TOKEN':CSRF,'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'});
    if(r.ok){
      var a=await r.json();
      if(Array.isArray(a)&&a.length){
        SITES=a.map(function(s){return {id:String(s.id),name:s.name,address:s.address||'',lat:(s.lat!=null?+s.lat:null),lng:(s.lng!=null?+s.lng:null),status:s.status||'active',radius:s.radius,unit:s.unit};})
               .filter(function(s){return s.lat!=null&&s.lng!=null&&!isNaN(s.lat)&&!isNaN(s.lng);});
      } else { SITES=loadSites(); }
    } else { SITES=loadSites(); }
  }catch(e){ SITES=loadSites(); }
  renderSites();
  fitSites();
  renderSiteList();
}
initSites();
</script>
