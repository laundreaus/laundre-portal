---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ts3idy9njqfd/laundre-portal
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rsync -a --delete --exclude='.git' --exclude='.env' --exclude='storage/app/public' ./ "$DEPLOYPATH"/
    - /bin/chmod 755 "$DEPLOYPATH"
    - cd "$DEPLOYPATH" && /bin/mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && /bin/chmod -R 775 bootstrap/cache storage
    - cd "$DEPLOYPATH" && COMPOSER_MEMORY_LIMIT=-1 /usr/local/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan migrate --force
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan storage:link || true
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan config:cache && /usr/local/bin/php artisan route:cache
