---
deployment:
  tasks:
    # EDIT this to your cPanel home path, e.g. /home/laundreaus
    - export DEPLOYPATH=/home/ts3idy9njqfd/laundre-portal
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rsync -a --delete --exclude='.git' --exclude='.env' --exclude='storage/app/public' ./ "$DEPLOYPATH"/
    - cd "$DEPLOYPATH" && /usr/local/bin/php -d memory_limit=-1 /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan migrate --force
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan storage:link || true
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan config:cache && /usr/local/bin/php artisan route:cache
